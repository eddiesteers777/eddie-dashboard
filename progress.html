<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Progress | Southbound Coaching</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/trends.css">
    <link rel="stylesheet" href="css/progress.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F2019">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="icons/favicon-32.png">

</head>

<body>

    <div id="header"></div>

    <main class="container pg-page">

        <section class="eos-today-hero">
            <div>
                <div class="eos-today-eyebrow">Your Progress</div>
                <h1>My Progress</h1>
                <p id="progressIntro" class="eos-today-phase">The last four weeks of your training with Southbound.</p>
            </div>
        </section>

        <!-- The numbers that fit what they do (js/progressView.js). -->
        <section id="progressMetrics" class="pg-metrics" aria-label="Progress summary">
            <div class="sb-loading" role="status"><span class="sr-only">Loading…</span><span class="sb-skeleton" style="width:92%"></span><span class="sb-skeleton" style="width:70%"></span></div>
        </section>

        <section id="weekCard" class="eos-today-card pg-card" hidden>
            <div class="eos-today-card-header"><h2>This Week</h2><span id="weekLabel" class="eos-today-date"></span></div>
            <div id="weekBody"></div>
        </section>

        <section id="sessionsCard" class="eos-today-card pg-card" hidden>
            <div class="eos-today-card-header"><h2>Your Sessions</h2><a href="schedule.html" class="pg-link">Schedule <span data-icon="chevronRight"></span></a></div>
            <div id="sessionsBody"></div>
        </section>

        <section id="trendCard" class="eos-today-card pg-card" hidden>
            <div class="eos-today-card-header"><h2>Six Weeks</h2></div>
            <div id="trendBody"></div>
        </section>

        <section id="planCard" class="eos-today-card pg-card" hidden>
            <div class="eos-today-card-header"><h2>Your Plan</h2><a href="plan.html" class="pg-link">My Plan <span data-icon="chevronRight"></span></a></div>
            <div id="planBody"></div>
        </section>

        <section id="checkinCard" class="eos-today-card pg-card" hidden>
            <div class="eos-today-card-header"><h2>Check-ins</h2><a href="checkin.html" class="pg-link">Check in <span data-icon="chevronRight"></span></a></div>
            <div id="checkinBody"></div>
        </section>

        <section id="emptyCard" class="eos-today-card pg-card" hidden>
            <div class="eos-today-card-header"><h2>Getting Started</h2></div>
            <p id="emptyText" class="pg-note"></p>
        </section>

    </main>

    <script src="js/loadHeader.js"></script>
    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/clientProgress.js"></script>
    <script src="js/registerSW.js"></script>

</body>

</html>
