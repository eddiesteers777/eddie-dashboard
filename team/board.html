<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B2A5B">
<title>Calera Eagles Board</title>
<link rel="stylesheet" href="board.css">
</head>
<body>
<main class="tb" id="app" hidden>
  <header class="tb-top">
    <a class="tb-back" href="../coach.html" aria-label="Back to Coach">&larr;</a>
    <div class="tb-mark" aria-hidden="true">C</div>
    <div class="tb-titles">
      <h1>Calera Eagles Board</h1>
      <input id="title" class="tb-title-input" aria-label="Board name" maxlength="60">
    </div>
    <div class="tb-actions">
      <button class="tb-btn tb-icon" id="undo" aria-label="Undo" title="Undo">&#8630;</button>
      <button class="tb-btn tb-icon" id="redo" aria-label="Redo" title="Redo">&#8631;</button>
      <button class="tb-btn tb-primary" id="export">Export</button>
    </div>
  </header>

  <div class="tb-tools" id="tools" role="toolbar" aria-label="Drawing tools"></div>

  <div class="tb-layout">
    <section class="tb-side tb-left" aria-label="Formation">
      <h2>Your team</h2>
      <div class="tb-chips" id="homeChips" role="group" aria-label="Your formation"></div>
      <h2>Opponent</h2>
      <label class="tb-check"><input type="checkbox" id="showAway" checked> Show opponent</label>
      <div class="tb-chips" id="awayChips" role="group" aria-label="Opponent formation"></div>
    </section>

    <section class="tb-stage" aria-label="Pitch">
      <svg id="pitch" viewBox="0 0 68 105" role="application" aria-label="Tactical board. Drag players to move them."></svg>
    </section>

    <section class="tb-side tb-right" aria-label="Selected player">
      <h2>Selected</h2>
      <div id="selEmpty" class="tb-hint">Tap a player, line or note to edit it. Drag players and the ball anywhere.</div>
      <div id="selMark" hidden>
        <label id="markTextWrap">Note text <input id="markText" type="text" maxlength="40" autocomplete="off"></label>
        <button class="tb-btn" id="markDel">Delete this</button>
      </div>
      <div id="selForm" hidden>
        <label>Number <input id="selNum" type="number" min="0" max="99" inputmode="numeric"></label>
        <label>Name <input id="selName" type="text" maxlength="24" autocomplete="off" placeholder="First name"></label>
      </div>
      <h2>Scenario</h2>
      <select id="scenario" aria-label="Scenario">
        <option>Build-up</option><option>Attacking</option><option>Defending</option>
        <option>Transition</option><option>Pressing</option><option>Set piece</option>
      </select>
      <h2>Pitch view</h2>
      <div class="tb-chips" id="viewChips" role="group" aria-label="Pitch view"></div>
      <div class="tb-row">
        <button class="tb-btn" id="clearMarks">Clear drawings</button>
        <button class="tb-btn" id="reset">Reset board</button>
      </div>
    </section>
  </div>

  <dialog id="exportDlg" class="tb-dlg">
    <h2>Export</h2>
    <button class="tb-btn tb-primary" id="expPng">Save as image (PNG)</button>
    <button class="tb-btn" id="expJson">Save board file (.json)</button>
    <label class="tb-btn tb-file">Open a board file<input type="file" id="impJson" accept="application/json,.json" hidden></label>
    <button class="tb-btn" id="expClose">Close</button>
  </dialog>
  <div id="toast" class="tb-toast" role="status" aria-live="polite"></div>
</main>
<p id="gate" class="tb-gate">Checking your account…</p>
<script type="module" src="board.js"></script>
</body>
</html>
