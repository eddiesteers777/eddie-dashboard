name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Reset worktree to exact commit
        run: git reset --hard "${{ github.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The Firestore emulator used by the rules tests runs on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Verify service worker checkout
        run: |
          echo "HEAD: $(git rev-parse HEAD)"
          echo "Committed sw.js:"
          git show HEAD:sw.js | grep -m1 'const VERSION'
          echo "Working sw.js:"
          grep -m1 'const VERSION' sw.js
          git diff --exit-code -- sw.js

      - name: Static checks (syntax, links, imports, site manifest)
        run: npm run test:static

      - name: Firestore security rules (emulator)
        run: npm run test:rules

      - name: Stripe functions checks
        run: npm run test:stripe
