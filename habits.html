<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Habits | Southbound Coaching</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/habits.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F2019">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="icons/favicon-32.png">

</head>

<body>

    <div id="header"></div>

    <main class="habits-page">

        <section class="habits-hero sb-hero-tiled">

            <div>
                <div class="sb-eyebrow">Every day</div>
                <h1>Habits</h1>
                <p class="habits-hero-sub">
                    Small checkmarks, stacked daily.
                </p>
            </div>

            <div class="habits-hero-stats">

                <div class="habits-hero-stat">
                    <span id="habitsStreakValue" class="habits-hero-number">0</span>
                    <span class="habits-hero-unit">day streak</span>
                </div>

                <div class="habits-hero-stat">
                    <span id="habitsCompletionValue" class="habits-hero-number">--</span>
                    <span class="habits-hero-unit">last 30 days</span>
                </div>

            </div>

            <div class="sb-brand-tile" aria-hidden="true"></div>
        </section>

        <section class="habits-week" aria-labelledby="habitsWeekTitle">

            <div class="habits-week-head">
                <h2 id="habitsWeekTitle">This week</h2>
                <span id="habitsWeekCount" class="habits-week-count"></span>
            </div>

            <div id="habitsWeekBar" class="habits-week-bar" role="group" aria-label="Habits, day by day this week"></div>

            <p id="habitsWeekCue" class="habits-week-cue" role="status" hidden></p>

        </section>

        <div class="habits-view-toggle" id="habitsViewToggle">

            <button type="button" class="habits-view-btn active" data-habits-view="today">
                Today
            </button>

            <button type="button" class="habits-view-btn" data-habits-view="calendar">
                Calendar
            </button>

            <button type="button" class="habits-view-btn" data-habits-view="habits">
                Habits
            </button>

        </div>

        <!-- Today -->

        <div class="habits-panel active" data-habits-panel="today">

            <div class="habits-day-nav">

                <button type="button" id="habitsPrevDay" class="habits-nav-btn">←</button>

                <span id="habitsDayLabel" class="habits-day-label sb-wait"></span>

                <button type="button" id="habitsNextDay" class="habits-nav-btn">→</button>

                <button type="button" id="habitsTodayBtn" class="habits-row-btn">Today</button>

            </div>

            <div class="habits-checklist-card" data-cel-card>

                <div class="habits-checklist-header">
                    <span>Checklist</span>
                    <span id="habitsChecklistCount" class="habits-checklist-count"></span>
                </div>

                <div id="habitsProgress" class="habits-progress" role="progressbar" aria-label="Habits done" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>

                <div id="habitsChecklist" class="habits-checklist"></div>

            </div>

        </div>

        <!-- Calendar -->

        <div class="habits-panel" data-habits-panel="calendar">

            <div class="habits-cal-toolbar">

                <button type="button" id="habitsCalPrev" class="habits-nav-btn">←</button>

                <span id="habitsCalLabel" class="habits-day-label sb-wait"></span>

                <button type="button" id="habitsCalNext" class="habits-nav-btn">→</button>

                <button type="button" id="habitsCalToday" class="habits-row-btn">Today</button>

            </div>

            <div class="habits-cal-grid-header">
                <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span>
                <span>Fri</span><span>Sat</span><span>Sun</span>
            </div>

            <div id="habitsCalGrid" class="habits-cal-grid"></div>

            <div class="habits-cal-legend">
                <span><i class="habits-sw" style="background:var(--surface-light)"></i> none</span>
                <span><i class="habits-sw" style="background:var(--amber)"></i> partial</span>
                <span><i class="habits-sw" style="background:var(--teal)"></i> most</span>
                <span><i class="habits-sw" style="background:var(--primary)"></i> perfect</span>
            </div>

        </div>

        <!-- Habits -->

        <div class="habits-panel" data-habits-panel="habits">

            <div id="habitsManageList" class="habits-manage-list"></div>

            <div class="habits-add-row">

                <input
                    type="text"
                    id="newHabitInput"
                    maxlength="60"
                    placeholder="New habit...">

                <button type="button" id="addHabitBtn" class="habits-row-btn primary">
                    Add
                </button>

            </div>

        </div>

    </main>

    <script src="js/loadHeader.js"></script>

    <script type="module" src="js/habits.js"></script>

    <script src="js/registerSW.js"></script>

</body>

</html>
