<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B2A5B">
<title>Calera Practice Planner</title>
<link rel="stylesheet" href="board.css">
<link rel="stylesheet" href="drills.css">
<link rel="stylesheet" href="practice.css">
</head>
<body>
<main class="tb" id="app" hidden>
  <header class="tb-top">
    <a class="tb-back" href="drills.html" aria-label="Back to drills">&larr;</a>
    <div class="tb-mark" aria-hidden="true">C</div>
    <div class="tb-titles"><h1>Practice Planner</h1><span class="tb-title-input" id="sub"></span></div>
    <div class="tb-actions">
      <button class="tb-btn" id="mine">My practices</button>
      <button class="tb-btn tb-primary" id="print">Print</button>
    </div>
  </header>

  <div class="pr-layout">
    <section class="tb-side pr-setup" aria-label="Today's practice">
      <h2>Practice</h2>
      <label>Name <input id="title" maxlength="60"></label>
      <div class="dr-two pr-pair">
        <label>Date <input id="date" type="date"></label>
        <label>Start time <input id="start" type="time"></label>
        <label>Minutes <input id="total" type="number" min="20" max="180" step="5" inputmode="numeric"></label>
        <label>Players here <input id="players" type="number" min="1" max="30" inputmode="numeric"></label>
      </div>
      <label>Next game <select id="game"></select></label>
      <h2>Equipment you have</h2>
      <div class="pr-eq" id="eq"></div>
      <h2>Work on (pick up to 4)</h2>
      <div class="tb-chips" id="focus" role="group" aria-label="Focus"></div>
      <div class="pr-btns">
        <button class="tb-btn tb-primary" id="build">Build practice</button>
        <button class="tb-btn" id="again">Try different drills</button>
      </div>
      <p class="tb-hint" id="notes"></p>
    </section>

    <section class="pr-sheet" id="sheet" aria-label="Practice plan">
      <div class="pr-head">
        <h2 id="shTitle"></h2>
        <p id="shMeta" class="dr-meta"></p>
        <p id="shEq" class="pr-needs"></p>
      </div>
      <ol class="pr-list" id="list"></ol>
      <p class="tb-hint" id="empty">Set today's limits on the left and tap Build practice.</p>
      <div class="pr-add no-print">
        <select id="addSel" aria-label="Add a drill"></select>
        <button class="tb-btn" id="addBtn">Add drill</button>
      </div>
      <p class="pr-total" id="totalLine"></p>
    </section>
  </div>

  <dialog id="mineDlg" class="tb-dlg tb-dlg-wide">
    <h2>My practices</h2>
    <button class="tb-btn tb-primary" id="saveBtn">Save this practice</button>
    <ul class="tb-list" id="mineList"></ul>
    <p class="tb-hint" id="mineEmpty">No saved practices yet.</p>
    <div class="tb-dlg-foot"><button class="tb-btn" id="mineClose">Close</button></div>
  </dialog>
  <div id="toast" class="tb-toast" role="status" aria-live="polite"></div>
</main>
<p id="gate" class="tb-gate">Checking your account…</p>
<script type="module" src="practice.js"></script>
</body>
</html>
