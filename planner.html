<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Planner</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* Colors/fonts come from css/style.css (loaded first on every
   page) -- only Planner-specific layout lives here. */

.planner-page *{ box-sizing:border-box; }
.planner-page [hidden], #plannerSheet[hidden]{ display:none !important; }

.planner-page{
    max-width:1200px;
    margin:36px auto 60px;
    padding:0 24px;
    position:relative;
}

.planner-page::before{
    content:"";
    position:absolute;
    top:-30px;
    right:0;
    width:200px;
    height:200px;
    background:url('brand/sb-mark.svg') center/contain no-repeat;
    opacity:.045;
    pointer-events:none;
}

.planner-page h1{
    margin:0;
    font-family:var(--font-display);
    font-size:54px;
    letter-spacing:.04em;
}

.planner-intro{
    margin:6px 0 22px;
    color:var(--muted);
    font-size:15px;
}

.planner-toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:16px;
}

.planner-toolbar h2{
    margin:0 auto 0 0;
    font-family:var(--font-display);
    font-size:34px;
    letter-spacing:.04em;
}

.planner-btn{
    min-height:40px;
    padding:0 16px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--surface);
    color:var(--text);
    font:600 14px/1 var(--font-body);
    cursor:pointer;
    transition:.15s;
}

.planner-btn:hover{ border-color:var(--primary); }

.planner-btn.primary{
    background:var(--primary);
    border-color:var(--primary);
    color:var(--on-primary);
}

.planner-btn.danger{ color:#EF4444; }

.planner-legend{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin:0 0 16px;
    font-size:13px;
    color:var(--muted);
}

.planner-legend span{ display:flex; align-items:center; gap:7px; }
.planner-legend i{ width:10px; height:10px; border-radius:50%; display:inline-block; }

.planner-grid{
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
}

.planner-dow{
    padding:12px 6px;
    background:var(--surface-light);
    border-bottom:1px solid var(--border);
    text-align:center;
    font-size:12px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--text-secondary);
}

.planner-day{
    min-height:110px;
    padding:8px;
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    background:transparent;
    color:var(--text);
    text-align:left;
    font:inherit;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:4px;
    min-width:0;
}

.planner-day:nth-child(7n + 7){ border-right:0; }
.planner-day:hover{ background:rgba(201,173,132,.06); }
.planner-day.is-selected{ box-shadow:inset 0 0 0 2px var(--primary); }
.planner-day.is-empty{ cursor:default; background:rgba(0,0,0,.12); }
.planner-day.is-empty:hover{ background:rgba(0,0,0,.12); }

.planner-day-num{
    font-size:14px;
    font-weight:700;
    width:26px;
    height:26px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
}

.planner-day.is-today .planner-day-num{
    background:var(--primary);
    color:var(--on-primary);
}

.planner-chip{
    display:block;
    width:100%;
    padding:4px 6px;
    border:0;
    border-radius:6px;
    background:var(--chip);
    color:#0F2019;
    font:700 11px/1.3 var(--font-body);
    text-align:left;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    cursor:pointer;
}

.planner-chip.is-deadline{ color:#fff; }

.planner-more{ font-size:11px; color:var(--muted); }

.planner-section-title{
    margin:32px 0 12px;
    font-size:13px;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text-secondary);
}

.planner-list{ display:flex; flex-direction:column; gap:8px; }

.planner-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    width:100%;
    padding:12px 14px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    color:var(--text);
    font:inherit;
    text-align:left;
    cursor:pointer;
}

.planner-row:hover{ border-color:rgba(201,173,132,.35); }
.planner-row i{ flex:0 0 10px; height:10px; margin-top:5px; border-radius:50%; background:var(--chip); }
.planner-row strong{ display:block; font-size:14px; }
.planner-row span{ display:block; font-size:13px; color:var(--text-secondary); margin-top:2px; }

.planner-empty{ color:var(--muted); font-size:14px; }

/* ---- Add / edit sheet ---- */

#plannerSheet{
    position:fixed;
    inset:0;
    z-index:5000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(5,12,9,.72);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
}

.planner-sheet-card{
    width:100%;
    max-width:460px;
    max-height:90vh;
    overflow:auto;
    padding:22px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:0 30px 70px rgba(0,0,0,.5);
}

.planner-sheet-card h3{ margin:0 0 16px; font-size:20px; }

.planner-field{ display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
.planner-field > span{ font-size:12px; font-weight:600; color:var(--text-secondary); }

.planner-field input,
.planner-field select,
.planner-field textarea{
    width:100%;
    padding:10px 12px;
    background:var(--surface-light);
    border:1px solid var(--border);
    border-radius:12px;
    color:var(--text);
    font:14px var(--font-body);
    color-scheme:dark;
}

.planner-field textarea{ min-height:70px; resize:vertical; }
.planner-field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

.planner-sheet-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
.planner-sheet-actions .danger{ margin-right:auto; }

@media(max-width:650px){

    .planner-page{ padding:0 14px; margin-top:20px; }
    .planner-page h1{ font-size:42px; }
    .planner-toolbar h2{ flex:0 0 100%; font-size:28px; }
    .planner-day{ min-height:64px; padding:5px 4px; }
    .planner-day-num{ font-size:12px; width:22px; height:22px; }
    /* Titles don't fit in a phone-width cell: show a colored bar per
       event and read the details in the day list below. */
    .planner-chip{ height:6px; padding:0; font-size:0; pointer-events:none; }
    .planner-more{ font-size:10px; }

}

</style>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F2019">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="icons/favicon-32.png">

</head>

<body>

<div id="header"></div>

<main class="planner-page">

    <h1>Planner</h1>
    <p class="planner-intro">Your own calendar: classes, deadlines, appointments, anything. It's saved to your account, so it follows you to every device and only you can see it. Today's screen shows what's due today.</p>

    <div class="planner-toolbar">
        <h2 id="plannerMonthLabel"></h2>
        <button type="button" class="planner-btn" id="plannerPrev" aria-label="Previous month">&larr;</button>
        <button type="button" class="planner-btn" id="plannerToday">Today</button>
        <button type="button" class="planner-btn" id="plannerNext" aria-label="Next month">&rarr;</button>
        <button type="button" class="planner-btn primary" id="plannerAdd">+ Add Event</button>
    </div>

    <div class="planner-legend" id="plannerLegend"></div>

    <div class="planner-grid" id="plannerGrid"></div>

    <h3 class="planner-section-title" id="plannerDayTitle">Coming up</h3>
    <div class="planner-list" id="plannerList"></div>

</main>

<div id="plannerSheet" hidden>
    <form class="planner-sheet-card" id="plannerForm">
        <h3 id="plannerSheetTitle">Add Event</h3>
        <label class="planner-field">
            <span>What</span>
            <input type="text" id="plannerTitle" maxlength="120" required placeholder="e.g. Midterm, Dentist, Team meeting">
        </label>
        <div class="planner-field-row">
            <label class="planner-field">
                <span>Date</span>
                <input type="date" id="plannerDate" required>
            </label>
            <label class="planner-field">
                <span>Time (optional)</span>
                <input type="time" id="plannerTime">
            </label>
        </div>
        <label class="planner-field">
            <span>Type</span>
            <select id="plannerCategory"></select>
        </label>
        <label class="planner-field">
            <span>Notes (optional)</span>
            <textarea id="plannerNotes" maxlength="500"></textarea>
        </label>
        <div class="planner-sheet-actions">
            <button type="button" class="planner-btn danger" id="plannerDelete" hidden>Delete</button>
            <button type="button" class="planner-btn" id="plannerCancel">Cancel</button>
            <button type="submit" class="planner-btn primary">Save</button>
        </div>
    </form>
</div>

<script src="js/loadHeader.js"></script>

<script type="module">

import {
    PLANNER_CATEGORIES, categoryFor, loadPlannerEvents, upsertPlannerEvent,
    deletePlannerEvent, eventsOnDate, getUpcomingPlannerEvents, isoDate, formatTime
} from "./js/plannerEvents.js";

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const $ = id => document.getElementById(id);

const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

let viewYear = new Date().getFullYear();
let viewMonth = new Date().getMonth();
let selectedDate = null; // "YYYY-MM-DD" when a day is tapped
let editingId = null;

$("plannerLegend").innerHTML = PLANNER_CATEGORIES
    .map(c => `<span><i style="background:${c.color}"></i>${c.label}</span>`).join("");
$("plannerCategory").innerHTML = PLANNER_CATEGORIES
    .map(c => `<option value="${c.value}">${c.label}</option>`).join("");

function niceDate(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
}

const niceTime = formatTime;

function chipHtml(ev) {
    const cat = categoryFor(ev.category);
    return `<span class="planner-chip ${ev.category === "deadline" ? "is-deadline" : ""}" style="--chip:${cat.color}" data-edit="${esc(ev.id)}" title="${esc(ev.title)}">${esc(ev.time ? `${niceTime(ev.time)} ${ev.title}` : ev.title)}</span>`;
}

function rowHtml(ev, withDate) {
    const cat = categoryFor(ev.category);
    const when = [withDate ? niceDate(ev.date) : "", niceTime(ev.time), cat.label].filter(Boolean).join(" · ");
    return `
        <button type="button" class="planner-row" style="--chip:${cat.color}" data-edit="${esc(ev.id)}">
            <i></i>
            <div>
                <strong>${esc(ev.title)}</strong>
                <span>${esc(when)}</span>
                ${ev.notes ? `<span>${esc(ev.notes)}</span>` : ""}
            </div>
        </button>`;
}

function render() {
    const events = loadPlannerEvents();
    const todayIso = isoDate(new Date());

    $("plannerMonthLabel").textContent = `${MONTHS[viewMonth]} ${viewYear}`;

    const firstDow = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const cells = DOW.map(d => `<div class="planner-dow">${d}</div>`);

    for (let i = 0; i < firstDow; i++) cells.push(`<div class="planner-day is-empty"></div>`);
    for (let day = 1; day <= daysInMonth; day++) {
        const iso = isoDate(new Date(viewYear, viewMonth, day));
        const dayEvents = eventsOnDate(iso, events);
        const shown = dayEvents.slice(0, 3).map(chipHtml).join("");
        const more = dayEvents.length > 3 ? `<span class="planner-more">+${dayEvents.length - 3} more</span>` : "";
        cells.push(`
            <div class="planner-day ${iso === todayIso ? "is-today" : ""} ${iso === selectedDate ? "is-selected" : ""}" role="button" tabindex="0" data-day="${iso}" aria-label="${niceDate(iso)}${dayEvents.length ? `, ${dayEvents.length} event${dayEvents.length === 1 ? "" : "s"}` : ""}">
                <span class="planner-day-num">${day}</span>
                ${shown}${more}
            </div>`);
    }
    const trailing = (7 - ((firstDow + daysInMonth) % 7)) % 7;
    for (let i = 0; i < trailing; i++) cells.push(`<div class="planner-day is-empty"></div>`);
    $("plannerGrid").innerHTML = cells.join("");

    // Below the calendar: the tapped day, or what's coming up.
    if (selectedDate) {
        const dayEvents = eventsOnDate(selectedDate, events);
        $("plannerDayTitle").textContent = niceDate(selectedDate);
        $("plannerList").innerHTML = (dayEvents.length
            ? dayEvents.map(ev => rowHtml(ev, false)).join("")
            : `<p class="planner-empty">Nothing on this day.</p>`)
            + `<div><button type="button" class="planner-btn primary" data-add-on="${selectedDate}">+ Add on ${esc(niceDate(selectedDate))}</button></div>`;
    } else {
        const upcoming = getUpcomingPlannerEvents(45, events);
        $("plannerDayTitle").textContent = "Coming up";
        $("plannerList").innerHTML = upcoming.length
            ? upcoming.map(ev => rowHtml(ev, true)).join("")
            : `<p class="planner-empty">Nothing in the next 45 days. Tap a day or "+ Add Event" to add one.</p>`;
    }
}

function openSheet(event, date) {
    editingId = event?.id || null;
    $("plannerSheetTitle").textContent = editingId ? "Edit Event" : "Add Event";
    $("plannerTitle").value = event?.title || "";
    $("plannerDate").value = event?.date || date || isoDate(new Date());
    $("plannerTime").value = event?.time || "";
    $("plannerCategory").value = event?.category || "personal";
    $("plannerNotes").value = event?.notes || "";
    $("plannerDelete").hidden = !editingId;
    $("plannerSheet").hidden = false;
    $("plannerTitle").focus();
}

function closeSheet() {
    $("plannerSheet").hidden = true;
    editingId = null;
}

document.addEventListener("click", event => {
    const edit = event.target.closest("[data-edit]");
    if (edit) {
        const ev = loadPlannerEvents().find(e => e.id === edit.dataset.edit);
        if (ev) openSheet(ev);
        return;
    }
    const addOn = event.target.closest("[data-add-on]");
    if (addOn) { openSheet(null, addOn.dataset.addOn); return; }
    const day = event.target.closest("[data-day]");
    if (day) {
        selectedDate = selectedDate === day.dataset.day ? null : day.dataset.day;
        render();
    }
});

$("plannerGrid").addEventListener("keydown", event => {
    const day = event.target.closest("[data-day]");
    if (day && (event.key === "Enter" || event.key === " ")) { event.preventDefault(); day.click(); }
});

$("plannerPrev").addEventListener("click", () => {
    viewMonth -= 1;
    if (viewMonth < 0) { viewMonth = 11; viewYear -= 1; }
    selectedDate = null;
    render();
});

$("plannerNext").addEventListener("click", () => {
    viewMonth += 1;
    if (viewMonth > 11) { viewMonth = 0; viewYear += 1; }
    selectedDate = null;
    render();
});

$("plannerToday").addEventListener("click", () => {
    viewYear = new Date().getFullYear();
    viewMonth = new Date().getMonth();
    selectedDate = null;
    render();
});

$("plannerAdd").addEventListener("click", () => openSheet(null, selectedDate));
$("plannerCancel").addEventListener("click", closeSheet);
$("plannerSheet").addEventListener("click", event => { if (event.target.id === "plannerSheet") closeSheet(); });
document.addEventListener("keydown", event => { if (event.key === "Escape" && !$("plannerSheet").hidden) closeSheet(); });

$("plannerForm").addEventListener("submit", event => {
    event.preventDefault();
    const title = $("plannerTitle").value.trim();
    const date = $("plannerDate").value;
    if (!title || !date) return;
    upsertPlannerEvent({
        id: editingId || undefined,
        title,
        date,
        time: $("plannerTime").value || "",
        category: $("plannerCategory").value,
        notes: $("plannerNotes").value.trim()
    });
    // Jump to the event's month so it's visible right away.
    const [y, m] = date.split("-").map(Number);
    viewYear = y;
    viewMonth = m - 1;
    closeSheet();
    render();
});

$("plannerDelete").addEventListener("click", async () => {
    if (!editingId) return;
    const { sbConfirm } = await import("./js/ui.js");
    if (!(await sbConfirm("", { title: "Delete this event?", confirmLabel: "Delete", danger: true }))) return;
    deletePlannerEvent(editingId);
    closeSheet();
    render();
});

render();

// Pull the latest from the cloud (another device may have added
// events), then redraw.
import("./js/cloudSync.js")
    .then(({ initCloudSync }) => initCloudSync())
    .then(render)
    .catch(() => {});

</script>

    <script src="js/registerSW.js"></script>

</body>

</html>
