<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        Weekly Review | Southbound Coaching

    </title>

    <link
        rel="stylesheet"
        href="css/style.css">

    <link
        rel="stylesheet"
        href="css/weekly-review.css">
    <link rel="stylesheet" href="css/readiness.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F2019">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="icons/favicon-32.png">

</head>

<body>

    <div id="header"></div>

    <main class="wr-page">

        <section class="wr-hero sb-hero-corner">
            <div class="sb-brand-tile" aria-hidden="true"></div>

            <div class="sb-eyebrow">This week</div>
            <h1>Weekly Review</h1>
            <p id="wrWeekRange" class="wr-week-range sb-wait"></p>

        </section>

        <!-- A story in one scroll (docs/ATHLETE_MODEL_AUDIT.md section 9): js/weeklyStory.js
             draws 1, 2, 4, 5, 6 and 8 from the plan, the runs and the weekly decision;
             3 is js/weeklyLoad.js, 7 is js/thisWeekCard.js, 9 is js/weekly-review.js. -->

        <!-- 1. This week in a sentence -->
        <section class="wr-story wr-lead" id="wrSentence" aria-live="polite"><p class="wr-sentence sb-wait"></p></section>

        <!-- 2. Week at a glance -->
        <section class="wr-story" id="wrGlance">
            <h2 class="wr-section-title">Week at a glance</h2>
            <div class="wr-glance-body"><p class="sb-wait"></p></div>
        </section>

        <!-- 3. Training stimulus (js/weeklyLoad.js) -->
        <section id="wrLoad" class="wr-load" hidden></section>

        <!-- 4. Response -->
        <section class="wr-story" id="wrResponse" hidden>
            <h2 class="wr-section-title">How the runs landed</h2>
            <div class="wr-story-body"></div>
        </section>

        <!-- 5. Recovery -->
        <section class="wr-story" id="wrRecovery" hidden>
            <h2 class="wr-section-title">Recovery</h2>
            <div class="wr-story-body"></div>
        </section>

        <!-- 6. What the model thinks -->
        <section class="wr-story" id="wrReading" hidden>
            <h2 class="wr-section-title">What it adds up to</h2>
            <div class="wr-story-body"></div>
        </section>

        <!-- 7. The decision (js/thisWeekCard.js; Apply / Not this week work here as on Today) -->
        <section id="thisWeekCard" class="tw-card" data-mode="review" aria-live="polite"></section>

        <!-- 8. Next week -->
        <section class="wr-story" id="wrNext" hidden>
            <h2 class="wr-section-title">Next 7 days</h2>
            <div class="wr-story-body"></div>
        </section>

        <!-- 9. Rate this week's runs, and the rest -->
        <div id="wrRate" class="sb-effort wr-rate" hidden></div>

        <section class="wr-story wr-other" id="wrOther">
            <h2 class="wr-section-title">Also this week</h2>
            <ul class="wr-other-list">
                <li><span>Strength</span><b id="wrStrengthValue">—</b><small id="wrStrengthMeta">this week</small></li>
                <li><span>Cross-training</span><b id="wrCrossValue">—</b><small id="wrCrossMeta">days this week</small></li>
                <li><span>Nutrition</span><b id="wrNutritionValue">—</b><small id="wrNutritionMeta">of calorie goal, avg</small></li>
                <li><span>Shoes</span><b id="wrGearValue">—</b><small id="wrGearMeta">nearing replacement</small></li>
            </ul>
            <div id="wrNutritionDays" class="wr-nutrition-grid" aria-label="Nutrition, day by day"></div>
        </section>

    </main>

    <script src="js/loadHeader.js"></script>

    <script type="module" src="js/weekly-review.js"></script>
    <script type="module" src="js/weeklyStory.js"></script>
    <script type="module" src="js/thisWeekCard.js"></script>

    <script src="js/registerSW.js"></script>

</body>

</html>
