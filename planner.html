<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Planner</title>

<link rel="stylesheet" href="css/style.css">

<style>

:root{
    --bg:#0F172A;
    --surface:#1E293B;
    --surface-alt:#273449;
    --line:#334155;
    --text:#F8FAFC;
    --muted:#94A3B8;
    --accent:#4EA8FF;
    --font-body:'Inter',sans-serif;
    --font-display:'Bebas Neue',sans-serif;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
}

.wrap{
    max-width:1400px;
    margin:36px auto 60px;
    padding:0 24px;
}

h1{
    margin:0;
    font-family:var(--font-display);
    font-size:54px;
    letter-spacing:.04em;
}

p{
    margin:6px 0 24px;
    color:var(--muted);
    font-size:15px;
}

.months{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:24px;
}
button{
    padding:12px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--surface);
    color:var(--text);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:var(--accent);
    color:#0F172A;
    transform:translateY(-2px);
}

h2{
    margin:0 0 18px;
    font-family:var(--font-display);
    font-size:34px;
    letter-spacing:.04em;
}

table{
    width:100%;
    border-collapse:collapse;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,.18);
}

th{
    background:var(--surface-alt);
    color:var(--text);
    padding:14px 8px;
    border:1px solid var(--line);
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.06em;
}

td{
    width:14.285%;
    height:110px;
    vertical-align:top;
    padding:8px;
    border:1px solid var(--line);
}

td b{
    display:block;
    margin-bottom:6px;
    font-size:15px;
}

.event{
    display:block;
    margin-top:5px;
    padding:4px 6px;
    border-radius:6px;
    background:var(--accent);
    color:#0F172A;
    font-size:11px;
    font-weight:700;
    line-height:1.3;
}
@media(max-width:900px){

    .months{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:650px){

    .months{
        grid-template-columns:1fr;
    }

    th,
    td{
        height:80px;
        font-size:12px;
    }

}

</style>

</head>

<body>

<div id="header"></div>

<div class="wrap">

<h1>2026–2027 Planner</h1>

<p>Official Shelby County calendar preloaded.</p>

<div class="months" id="m"></div>

<div id="cal"></div>

</div>

<script src="js/loadHeader.js"></script>

<script>

const names=[
    "January","February","March","April","May","June",
    "July","August","September","October","November","December"
];

const events={
    7:{
        6:"PD",
        7:"PD",
        10:"Teacher Institute",
        12:"Teacher Workday",
        13:"First Day of School"
    },

    8:{
        7:"Labor Day"
    },

    9:{
        9:"End of 1st Nine Weeks",
        12:"Fall Break",
        13:"Fall Break",
        16:"Report Cards"
    },

    10:{
        11:"Veterans Day",
        23:"Thanksgiving Break",
        24:"Thanksgiving Break",
        25:"Thanksgiving Break",
        26:"Thanksgiving Break",
        27:"Thanksgiving Break"
    },

    11:{
        18:"End of 2nd Nine Weeks / Early Dismissal",
        21:"Winter Break",
        22:"Winter Break",
        23:"Winter Break",
        24:"Winter Break",
        25:"Winter Break",
        28:"Winter Break",
        29:"Winter Break",
        30:"Winter Break",
        31:"Winter Break"
    },

    0:{
        1:"Winter Break",
        4:"Teacher Workday",
        5:"2nd Semester Begins",
        8:"Report Cards",
        18:"MLK Day"
    },

    1:{
        15:"Presidents Day / Teacher Workday"
    },

    2:{
        5:"End of 3rd Nine Weeks",
        8:"Planning Day",
        12:"Report Cards",
        22:"Spring Break",
        23:"Spring Break",
        24:"Spring Break",
        25:"Spring Break",
        26:"Spring Break"
    },
     3:{
        23:"PD / Planning"
    },

    4:{
        27:"End of 4th Nine Weeks / Early Dismissal",
        28:"Teacher Workday",
        31:"Memorial Day"
    }

};

const holder=document.getElementById('m');

names.forEach((name,index)=>{

    const button=document.createElement('button');

    button.textContent=name;

    button.onclick=()=>draw(index);

    holder.appendChild(button);

});

function cell(month,day){

    const event=
        events[month] && events[month][day]
            ? `<span class="event">${events[month][day]}</span>`
            : '';

    return `
        <td>
            <b>${day}</b>
            ${event}
        </td>
    `;

}

function draw(month){
    const year=month>=6 ? 2026 : 2027;

    const firstDay=new Date(year,month,1).getDay();

    const daysInMonth=new Date(year,month+1,0).getDate();

    let html=`
        <h2>${names[month]} ${year}</h2>

        <table>

        <tr>
            ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat']
                .map(day=>`<th>${day}</th>`)
                .join('')}
        </tr>

        <tr>
    `;

    for(let i=0;i<firstDay;i++){

        html+='<td></td>';

    }

    let day=1;

    for(let i=firstDay;i<7;i++){

        html+=cell(month,day++);

    }

    html+='</tr>';

    while(day<=daysInMonth){

        html+='<tr>';

        for(let i=0;i<7;i++){

            html+=day<=daysInMonth
                ? cell(month,day++)
                : '<td></td>';

        }

        html+='</tr>';

    }

    html+='</table>';

    document.getElementById('cal').innerHTML=html;

}

draw(7);

</script>

</body>

</html>
