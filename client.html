<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Client | Southbound</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/clients.css">
    <link rel="stylesheet" href="css/client-hub.css">
    <link rel="stylesheet" href="css/homework.css">
    <link rel="stylesheet" href="css/client-profile.css">
    <link rel="stylesheet" href="css/client-model.css">
    <link rel="stylesheet" href="css/execution.css">
    <link rel="stylesheet" href="css/athlete-state.css">
    <link rel="stylesheet" href="css/strength-progress.css">
    <link rel="stylesheet" href="css/planning.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F2019">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="icons/favicon-32.png">

</head>

<body>

    <div id="header"></div>

    <main class="clients-page hub-page">

        <a href="clients.html" class="hub-back"><span data-icon="chevronLeft"></span> My Clients</a>

        <div id="hubLoading" class="clients-card"><div class="sb-loading" role="status"><span class="sr-only">Loading…</span><span class="sb-skeleton" style="width:92%"></span><span class="sb-skeleton" style="width:76%"></span><span class="sb-skeleton" style="width:58%"></span><span class="sb-skeleton" style="width:84%"></span></div></div>

        <div id="hubMissing" class="clients-empty" hidden>
            <span data-icon="users"></span>
            <p>This client isn't connected to your account (or the link is out of date).</p>
            <a href="clients.html" class="clients-btn-primary">Back to My Clients</a>
        </div>

        <div id="hubBody" hidden>

            <!-- Header -->
            <section class="hub-header">
                <div class="hub-avatar" id="hubAvatar"></div>
                <div class="hub-identity">
                    <h1 id="hubName"></h1>
                    <div class="hub-goesby" id="hubGoesBy" hidden></div>
                    <div class="hub-services" id="hubServices"></div>
                    <div class="hub-since" id="hubSince"></div>
                    <div class="hub-goal" id="hubGoal" hidden></div>
                </div>
                <div class="hub-contact">
                    <a class="clients-btn-secondary hub-email" id="hubCall" hidden><span data-icon="messageSquare"></span> Text</a>
                    <a class="clients-btn-secondary hub-email" id="hubEmail" hidden><span data-icon="mail"></span> Email</a>
                </div>
            </section>

            <!-- At a glance -->
            <section class="hub-glance" id="hubGlance"></section>

            <!-- Four tabs you use most, and the rest under More. Every tab keeps its name (data-tab), so links like client.html?tab=checkins and every "go to" button keep working. -->
<div class="hub-tabs-wrap">
<nav class="clients-tabs hub-tabs" aria-label="Client sections">
<button type="button" class="clients-tab active" data-tab="overview" aria-current="true">Overview</button>
<button type="button" class="clients-tab" data-tab="messages">Messages <span id="hubMessageBadge" class="clients-tab-badge" hidden></span></button>
<button type="button" class="clients-tab" data-tab="workouts">Workouts <span id="hubWorkoutBadge" class="clients-tab-badge" hidden></span></button>
<button type="button" class="clients-tab" data-tab="plan">Plan</button>
<button type="button" class="clients-tab hub-more-btn" id="hubMoreBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="hubMoreMenu"><span id="hubMoreLabel">More</span> <span id="hubMoreBadge" class="clients-tab-badge" hidden></span><span class="hub-more-caret" aria-hidden="true"></span></button>
</nav>
<div class="hub-more-menu" id="hubMoreMenu" role="menu" aria-label="More client sections" hidden>
<button type="button" class="clients-tab" role="menuitem" data-tab="checkins">Check-ins <span id="hubCheckinBadge" class="clients-tab-badge" hidden></span></button>
<button type="button" class="clients-tab" role="menuitem" data-tab="sessions">Sessions <span id="hubSessionBadge" class="clients-tab-badge" hidden></span></button>
<button type="button" class="clients-tab" role="menuitem" data-tab="homework" id="hubHomeworkTab" hidden>Homework</button>
<button type="button" class="clients-tab" role="menuitem" data-tab="progress">Progress</button>
<button type="button" class="clients-tab" role="menuitem" data-tab="planning">Planning</button>
<button type="button" class="clients-tab" role="menuitem" data-tab="model">Model</button>
<button type="button" class="clients-tab" role="menuitem" data-tab="profile">Profile</button>
<button type="button" class="clients-tab" role="menuitem" data-tab="notes">Notes</button>
<button type="button" class="clients-tab" role="menuitem" data-tab="history">History</button>
</div>
</div>

            <section class="clients-panel" data-panel="overview">
                <div id="hubAttention"></div>
                <div id="hubPinned"></div>
                <div id="hubAbout"></div>
                <div class="clients-card hub-packages-card" id="hubPackages"></div>
                <div class="hub-grid">
                    <div class="clients-card">
                        <h2>What's next</h2>
                        <div id="hubNext" class="hub-list"></div>
                    </div>
                    <div class="clients-card">
                        <h2>Recent activity</h2>
                        <div id="hubTimeline" class="hub-timeline"></div>
                        <button type="button" class="hub-see-all" id="hubSeeHistory" data-go-tab="history" hidden>See their whole history →</button>
                    </div>
                </div>
                <div class="clients-card" id="hubApplication" hidden>
                    <h2>From their application</h2>
                    <div id="hubApplicationBody"></div>
                </div>
                <div class="hub-actions" id="hubActions"></div>
            </section>

            <!-- The coach-client thread: js/messageView.js -->
            <section class="clients-panel" data-panel="messages" hidden>
                <div class="clients-card hub-messages" id="hubMessages"></div>
            </section>

            <section class="clients-panel" data-panel="plan" hidden>
                <div id="hubChanges"></div>
                <div id="hubPlan"></div>
            </section>

            <section class="clients-panel" data-panel="progress" hidden>
                <div id="hubProgress"></div>
            </section>

            <!-- Athlete model (coach only): js/clientModelTab.js -->
            <section class="clients-panel" data-panel="model" hidden>
                <div id="hubModel"></div>
            </section>

            <!-- Weekly planning (coach only): js/planningView.js -->
            <section class="clients-panel" data-panel="planning" hidden>
                <div id="hubPlanning"></div>
            </section>

            <section class="clients-panel" data-panel="checkins" hidden>
                <div id="hubCheckins" class="hub-list"></div>
            </section>

            <section class="clients-panel" data-panel="sessions" hidden>
                <div id="hubSessions"></div>
            </section>

            <!-- Soccer homework: js/homeworkCoach.js -->
            <section class="clients-panel" data-panel="homework" hidden>
                <div id="hubHomework"></div>
            </section>

            <section class="clients-panel" data-panel="workouts" hidden>
                <div id="hubWorkouts"></div>
            </section>

            <section class="clients-panel" data-panel="notes" hidden>
                <div id="hubNotes"></div>
            </section>

            <section class="clients-panel" data-panel="history" hidden>
                <div class="clients-card hub-history" id="hubHistory">
                    <div class="hub-history-head">
                        <h2>Everything with <span id="hubHistoryName">them</span></h2>
                        <p class="clients-card-note" id="hubHistoryStats"></p>
                        <p class="hub-history-key"><span class="hub-who hub-who-coach"></span> You <span class="hub-who hub-who-client"></span> <span id="hubHistoryThem">Them</span></p>
                    </div>
                    <input type="search" id="hubHistorySearch" class="clients-search" placeholder="Search their history (knee, tempo, long run…)" autocomplete="off" aria-label="Search their history">
                    <div id="hubHistoryFilters" class="clients-filters" role="group" aria-label="Show"></div>
                    <div id="hubHistoryList"></div>
                </div>
            </section>

            <section class="clients-panel" data-panel="profile" hidden>
                <p class="clients-card-note hub-profile-note" id="hubProfileNote"></p>
                <div id="hubProfileFresh"></div>
                <div id="hubProfile"></div>
            </section>

        </div>

    </main>

    <script src="js/loadHeader.js"></script>

    <script type="module" src="js/icons.js"></script>
    <script type="module" src="js/clientHub.js"></script>

    <script src="js/registerSW.js"></script>

</body>

</html>
