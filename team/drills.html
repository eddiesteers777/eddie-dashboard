<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B2A5B">
<title>Calera Drills</title>
<link rel="stylesheet" href="board.css">
<link rel="stylesheet" href="drills.css">
</head>
<body>
<main class="tb" id="app" hidden>
  <header class="tb-top">
    <a class="tb-back" href="board.html" aria-label="Back to the board">&larr;</a>
    <div class="tb-mark" aria-hidden="true">C</div>
    <div class="tb-titles"><h1>Calera Drills</h1><span class="tb-title-input" id="count"></span></div>
    <div class="tb-actions">
      <button class="tb-btn" id="more">More</button>
      <button class="tb-btn tb-primary" id="newDrill">New drill</button>
    </div>
  </header>

  <div class="dr-filters">
    <input id="q" type="search" placeholder="Search drills" aria-label="Search drills" autocomplete="off">
    <select id="fInt" aria-label="Intensity"><option value="">Any intensity</option><option>Low</option><option>Medium</option><option>High</option></select>
    <select id="fMin" aria-label="Time"><option value="0">Any length</option><option value="10">10 min or less</option><option value="15">15 min or less</option><option value="20">20 min or less</option></select>
  </div>
  <div class="tb-tools" id="topics" role="group" aria-label="Skill"></div>
  <div class="dr-grid" id="grid"></div>
  <p class="tb-hint" id="none" hidden>No drills match. Clear a filter or add your own.</p>

  <dialog id="detail" class="tb-dlg dr-dlg"></dialog>

  <dialog id="editor" class="tb-dlg dr-dlg">
    <form id="form" method="dialog">
      <h2 id="edTitle">Drill</h2>
      <label>Name <input name="name" required maxlength="80"></label>
      <div class="dr-two">
        <label>Skill <select name="topic" id="edTopic"></select></label>
        <label>Intensity <select name="intensity"><option>Low</option><option selected>Medium</option><option>High</option></select></label>
        <label>Minutes <input name="minutes" type="number" min="1" max="60" inputmode="numeric" value="10"></label>
        <label>Min. players <input name="minPlayers" type="number" min="1" max="30" inputmode="numeric" value="6"></label>
      </div>
      <label>Space <input name="space" maxlength="60" placeholder="e.g. 20x20 yd grid"></label>
      <label>Equipment (one per line) <textarea name="equipment" rows="3"></textarea></label>
      <label>Setup <textarea name="setup" rows="3" maxlength="600"></textarea></label>
      <label>How it runs and rotations <textarea name="how" rows="3" maxlength="800"></textarea></label>
      <label>Coaching points (one per line) <textarea name="points" rows="3"></textarea></label>
      <label>Progressions (one per line) <textarea name="progressions" rows="2"></textarea></label>
      <label>Easier versions (one per line) <textarea name="easier" rows="2"></textarea></label>
      <label>Diagram from a saved board <select name="boardId" id="edBoard"></select></label>
      <div class="tb-dlg-foot">
        <button type="button" class="tb-btn" id="edCancel">Cancel</button>
        <button type="submit" class="tb-btn tb-primary" id="edSave">Save drill</button>
      </div>
    </form>
  </dialog>

  <dialog id="moreDlg" class="tb-dlg">
    <h2>Drill library</h2>
    <button class="tb-btn" id="mBackup">Back up my drills</button>
    <label class="tb-btn tb-file">Import a drills file<input type="file" id="mImport" accept="application/json,.json" hidden></label>
    <button class="tb-btn" id="mSeeds">Add back the starter drills</button>
    <button class="tb-btn" id="mClose">Close</button>
  </dialog>
  <div id="toast" class="tb-toast" role="status" aria-live="polite"></div>
</main>
<p id="gate" class="tb-gate">Checking your account…</p>
<script type="module" src="drills.js"></script>
</body>
</html>
