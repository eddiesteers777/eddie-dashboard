<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>More | EddieOS</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F172A">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <style>
        /* Account/sync live here on mobile since the desktop navbar
           (where they normally show) is hidden below the app-shell
           breakpoint -- More is the natural place for them to land. */
        .eos-more-account{
            display:flex;
            align-items:center;
            gap:14px;
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:var(--radius);
            padding:18px 20px;
            margin-bottom:24px;
        }
        .eos-more-account-info{
            display:flex;
            align-items:center;
            gap:12px;
            flex:1;
            min-width:0;
        }
        .eos-more-account-avatar{
            flex-shrink:0;
            width:42px;
            height:42px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            background:var(--primary);
            color:#05131f;
            font-weight:800;
            font-size:16px;
        }
        .eos-more-account-info div{
            min-width:0;
            display:flex;
            flex-direction:column;
            gap:2px;
        }
        .eos-more-account-info strong{
            font-size:15px;
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
        }
        .eos-more-account-info span{
            font-size:12.5px;
            color:var(--text-secondary);
        }
        .eos-more-sync-btn{
            appearance:none;
            background:transparent;
            border:0;
            padding:0;
            margin:0;
            font:inherit;
            font-size:12.5px;
            color:var(--text-secondary);
            cursor:pointer;
            text-align:left;
        }
        .eos-more-sync-btn:hover:not(:disabled){
            color:var(--primary);
            text-decoration:underline;
        }
        .eos-more-sync-btn:disabled{
            cursor:default;
        }
        .eos-more-sync-btn.sync-syncing{
            opacity:.7;
            cursor:default;
        }
        .eos-more-sync-btn.sync-error{
            color:#EF4444;
        }
        .eos-more-account-btn{
            flex-shrink:0;
            padding:10px 16px;
            border:none;
            border-radius:11px;
            background:var(--primary);
            color:white;
            font-weight:650;
            font-size:13.5px;
            cursor:pointer;
            white-space:nowrap;
        }

        /* Rows get [hidden] toggled based on account entitlements
           (see js/navAccess.js) -- .more-row sets its own display
           below, which always outranks the browser's native
           [hidden]{display:none} at equal specificity/origin. */
        .more-list [hidden]{
            display:none !important;
        }

        /* Compact rows instead of description cards -- a symbol and
           a name is enough once More is a destination you already
           know, not something you need explained on every visit. */
        .more-list{
            display:flex;
            flex-direction:column;
            gap:8px;
        }
        .more-row{
            display:flex;
            align-items:center;
            gap:14px;
            padding:12px 14px;
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:16px;
            text-decoration:none;
            color:var(--text);
            transition:background-color .15s ease,border-color .15s ease;
        }
        .more-row:hover{
            background:var(--surface-light);
            border-color:rgba(78,168,255,.25);
        }
        .more-row-icon{
            flex-shrink:0;
            width:40px;
            height:40px;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:12px;
            color:white;
        }
        .more-row-name{
            flex:1;
            font-size:15.5px;
            font-weight:700;
        }
        .more-row-chevron{
            flex-shrink:0;
            color:var(--muted);
        }
    </style>

</head>

<body>

    <div id="header"></div>

    <main class="container">

        <section class="eos-today-hero">

            <div>
                <div class="eos-today-eyebrow">Everything Else</div>
                <h1>More</h1>
                <p class="eos-today-phase">
                    Analytics, plans, and settings that don't need a tab of their own.
                </p>
            </div>

        </section>

        <section class="eos-more-account">
            <div class="eos-more-account-info">
                <div class="eos-more-account-avatar" id="moreAvatar">?</div>
                <div>
                    <strong id="moreUserName">Guest</strong>
                    <button type="button" id="moreSyncStatus" class="eos-more-sync-btn" disabled>Not signed in</button>
                </div>
            </div>
            <button type="button" id="moreLoginBtn" class="eos-more-account-btn">Sign In</button>
            <button type="button" id="moreLogoutBtn" class="eos-more-account-btn" style="display:none;">Sign Out</button>
        </section>

        <section class="more-list">

            <a href="marathon.html" class="more-row" data-requires="training">
                <div class="more-row-icon" data-icon="activity" style="background:linear-gradient(135deg,#2563EB,#3B82F6)"></div>
                <span class="more-row-name">Marathon Plan</span>
                <span class="more-row-chevron" data-icon="chevronRight"></span>
            </a>

            <a href="75day.html" class="more-row" data-requires="training">
                <div class="more-row-icon" data-icon="flame" style="background:linear-gradient(135deg,#22C55E,#4ADE80)"></div>
                <span class="more-row-name">75-Day Challenge</span>
                <span class="more-row-chevron" data-icon="chevronRight"></span>
            </a>

            <a href="analytics.html" class="more-row" data-requires="training">
                <div class="more-row-icon" data-icon="trendingUp" style="background:linear-gradient(135deg,#F59E0B,#FBBF24)"></div>
                <span class="more-row-name">Analytics</span>
                <span class="more-row-chevron" data-icon="chevronRight"></span>
            </a>

            <a href="weekly-review.html" class="more-row" data-requires="training">
                <div class="more-row-icon" data-icon="clipboard" style="background:linear-gradient(135deg,#8B5CF6,#A855F7)"></div>
                <span class="more-row-name">Weekly Review</span>
                <span class="more-row-chevron" data-icon="chevronRight"></span>
            </a>

            <a href="gear.html" class="more-row" data-requires="training">
                <div class="more-row-icon" data-icon="footprint" style="background:linear-gradient(135deg,#EC4899,#F472B6)"></div>
                <span class="more-row-name">Gear</span>
                <span class="more-row-chevron" data-icon="chevronRight"></span>
            </a>

            <a href="planner.html" class="more-row" data-requires="training">
                <div class="more-row-icon" data-icon="calendar" style="background:linear-gradient(135deg,#06B6D4,#22D3EE)"></div>
                <span class="more-row-name">Planner</span>
                <span class="more-row-chevron" data-icon="chevronRight"></span>
            </a>

            <a href="programs.html" class="more-row" data-requires="training">
                <div class="more-row-icon" data-icon="target" style="background:linear-gradient(135deg,#6366F1,#818CF8)"></div>
                <span class="more-row-name">Programs</span>
                <span class="more-row-chevron" data-icon="chevronRight"></span>
            </a>

            <a href="pace-calculator.html" class="more-row">
                <div class="more-row-icon" data-icon="timer" style="background:linear-gradient(135deg,#2563EB,#3B82F6)"></div>
                <span class="more-row-name">Pace Calculator</span>
                <span class="more-row-chevron" data-icon="chevronRight"></span>
            </a>

            <a href="clients.html" class="more-row" data-requires="coach">
                <div class="more-row-icon" data-icon="users" style="background:linear-gradient(135deg,#0EA5E9,#38BDF8)"></div>
                <span class="more-row-name">My Clients</span>
                <span class="more-row-chevron" data-icon="chevronRight"></span>
            </a>

            <a href="schedule.html" class="more-row" data-requires="training,soccer">
                <div class="more-row-icon" data-icon="calendar" style="background:linear-gradient(135deg,#8B5CF6,#A855F7)"></div>
                <span class="more-row-name">Schedule</span>
                <span class="more-row-chevron" data-icon="chevronRight"></span>
            </a>

            <a href="coach.html" class="more-row" data-requires="coach">
                <div class="more-row-icon" data-icon="target" style="background:linear-gradient(135deg,#EF4444,#F87171)"></div>
                <span class="more-row-name">Coach Dashboard</span>
                <span class="more-row-chevron" data-icon="chevronRight"></span>
            </a>

            <a href="install.html" class="more-row">
                <div class="more-row-icon" data-icon="download" style="background:linear-gradient(135deg,#22C55E,#4ADE80)"></div>
                <span class="more-row-name">Get the App</span>
                <span class="more-row-chevron" data-icon="chevronRight"></span>
            </a>

            <a href="settings.html" class="more-row">
                <div class="more-row-icon" data-icon="user" style="background:linear-gradient(135deg,#64748B,#94A3B8)"></div>
                <span class="more-row-name">Settings</span>
                <span class="more-row-chevron" data-icon="chevronRight"></span>
            </a>

        </section>

    </main>

    <script src="js/loadHeader.js"></script>

    <script type="module" src="js/icons.js"></script>

    <script type="module">
        import { login, logout, listenForAuth } from "./js/auth.js";

        const nameEl = document.getElementById("moreUserName");
        const statusEl = document.getElementById("moreSyncStatus");
        const avatarEl = document.getElementById("moreAvatar");
        const loginBtn = document.getElementById("moreLoginBtn");
        const logoutBtn = document.getElementById("moreLogoutBtn");

        function formatRelativeTime(ts) {
            if (!ts) return "never synced on this device";

            const diffSec = Math.round((Date.now() - ts) / 1000);
            if (diffSec < 10) return "just now";
            if (diffSec < 60) return diffSec + "s ago";

            const diffMin = Math.round(diffSec / 60);
            if (diffMin < 60) return diffMin + "m ago";

            const diffHr = Math.round(diffMin / 60);
            if (diffHr < 24) return diffHr + "h ago";

            return Math.round(diffHr / 24) + "d ago";
        }

        async function refreshSyncLine() {
            const { getSyncStatus } = await import("./js/cloudSync.js");
            const status = getSyncStatus();

            const hasError = status.lastError && status.lastError !== "not-signed-in";
            statusEl.classList.toggle("sync-error", Boolean(hasError));
            statusEl.textContent = hasError
                ? "Sync error — tap to retry"
                : "Synced " + formatRelativeTime(status.lastSyncedAt);
        }

        statusEl?.addEventListener("click", async () => {
            if (statusEl.disabled) return;

            statusEl.disabled = true;
            statusEl.classList.add("sync-syncing");
            statusEl.classList.remove("sync-error");
            statusEl.textContent = "Syncing…";

            const { pullFromCloud, pushToCloud } = await import("./js/cloudSync.js");

            // Pull first (grab anything newer from another device),
            // then push (make sure this device's current state is
            // saved too) -- a manual tap should leave both sides
            // fully caught up, not just check one direction.
            await pullFromCloud();
            await pushToCloud();

            statusEl.classList.remove("sync-syncing");
            statusEl.disabled = false;

            // Reload so whatever was just pulled actually shows up
            // on screen, instead of sitting correctly in
            // localStorage but not reflected in this page's render.
            window.location.reload();
        });

        loginBtn?.addEventListener("click", async () => {
            loginBtn.disabled = true;
            loginBtn.textContent = "Signing in…";

            const success = await login();

            if (success) {
                window.location.reload();
            } else {
                loginBtn.disabled = false;
                loginBtn.textContent = "Sign In";
            }
        });

        logoutBtn?.addEventListener("click", async () => {
            await logout();
            window.location.reload();
        });

        listenForAuth(user => {
            if (user) {
                const name = user.displayName || "Runner";

                nameEl.textContent = name;
                avatarEl.textContent = name.slice(0, 1).toUpperCase();

                loginBtn.style.display = "none";
                logoutBtn.style.display = "inline-flex";

                statusEl.disabled = false;
                refreshSyncLine();
                setInterval(refreshSyncLine, 15000);
            } else {
                nameEl.textContent = "Guest";
                avatarEl.textContent = "?";
                statusEl.textContent = "Not signed in";
                statusEl.disabled = true;
                statusEl.classList.remove("sync-error", "sync-syncing");

                loginBtn.style.display = "inline-flex";
                logoutBtn.style.display = "none";
            }
        });
    </script>

    <script src="js/registerSW.js"></script>

</body>

</html>
