<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        Nutrition | EddieOS

    </title>

    <link
        rel="stylesheet"
        href="css/style.css">

    <link
        rel="stylesheet"
        href="css/nutrition.css">

</head>

<body>

    <!-- Header -->

    <div id="header"></div>

    <!-- Page -->

    <main class="nutrition-page">

        <section class="page-title">

            <h1>

                Nutrition

            </h1>

            <p>

                Fuel your body. Recover faster. Run stronger.

            </p>

        </section>

        <!-- Date Navigation -->

        <section class="date-navigation">

            <button
                id="previousDay"
                class="day-btn">

                ←

            </button>

            <div class="date-info">

                <h2 id="currentDate">

                    Loading...

                </h2>

                <span id="countdown">

                    Calculating...

                </span>

            </div>

            <button
                id="nextDay"
                class="day-btn">

                →

            </button>

        </section>

        <!-- Workout Card -->

        <section class="workout-card">

            <div>

                <span class="workout-label">

                    TODAY'S TRAINING

                </span>

                <h2 id="workoutTitle">

                    Loading...

                </h2>

                <p id="workoutDescription">

                    Loading today's workout...

                </p>

            </div>

        </section>

        <!-- Macro Cards -->

        <section
            id="macroGrid"
            class="macro-grid">

        </section>

        <!-- Meals -->

        <section class="meal-section">

            <h2>

                Meals

            </h2>

            <div class="meal-grid">

                <div class="meal-card">

                    <h3>Breakfast</h3>

                    <div class="food-search">
                        <input
                            type="text"
                            class="food-search-input"
                            data-meal="breakfast"
                            placeholder="Search for a food to log...">
                        <div
                            class="food-search-results"
                            data-meal="breakfast"></div>
                    </div>

                    <div
                        class="food-log"
                        id="foodLog-breakfast"></div>

                    <textarea
                        id="breakfast"
                        placeholder="Breakfast..."></textarea>

                </div>

                <div class="meal-card">

                    <h3>Lunch</h3>

                    <div class="food-search">
                        <input
                            type="text"
                            class="food-search-input"
                            data-meal="lunch"
                            placeholder="Search for a food to log...">
                        <div
                            class="food-search-results"
                            data-meal="lunch"></div>
                    </div>

                    <div
                        class="food-log"
                        id="foodLog-lunch"></div>

                    <textarea
                        id="lunch"
                        placeholder="Lunch..."></textarea>

                </div>

                <div class="meal-card">

                    <h3>Dinner</h3>

                    <div class="food-search">
                        <input
                            type="text"
                            class="food-search-input"
                            data-meal="dinner"
                            placeholder="Search for a food to log...">
                        <div
                            class="food-search-results"
                            data-meal="dinner"></div>
                    </div>

                    <div
                        class="food-log"
                        id="foodLog-dinner"></div>

                    <textarea
                        id="dinner"
                        placeholder="Dinner..."></textarea>

                </div>

                <div class="meal-card">

                    <h3>Snacks</h3>

                    <div class="food-search">
                        <input
                            type="text"
                            class="food-search-input"
                            data-meal="snacks"
                            placeholder="Search for a food to log...">
                        <div
                            class="food-search-results"
                            data-meal="snacks"></div>
                    </div>

                    <div
                        class="food-log"
                        id="foodLog-snacks"></div>

                    <textarea
                        id="snacks"
                        placeholder="Snacks, electrolytes, supplements..."></textarea>

                </div>

            </div>

        </section>

        <!-- Summary -->

        <section class="summary-grid">

            <div class="summary-card score-card">

                <h3>

                    Daily Score

                </h3>

                <div id="nutritionScore">

                    0%

                </div>

                <p id="scoreMessage">

                    Let's get started.

                </p>

            </div>

            <div
                id="remainingCard"
                class="summary-card">

            </div>

        </section>

    </main>

    <script src="js/loadHeader.js"></script>

    <script src="js/nutrition.js"></script>

</body>

</html>
