<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Plan | Southbound Coaching</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/clients.css">
    <link rel="stylesheet" href="css/my-plan.css">
    <link rel="stylesheet" href="css/week.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F2019">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="icons/favicon-32.png">

</head>

<body>

    <div id="header"></div>

    <main class="clients-page myplan-page">

        <section class="eos-today-hero">
            <div>
                <div class="eos-today-eyebrow">Coaching</div>
                <h1>My Plan</h1>
                <p class="eos-today-phase">The plan your coach built for you, week by week.</p>
            </div>
        </section>

        <div id="planLoading" class="clients-card"><div class="sb-loading" role="status"><span class="sr-only">Loading your plan</span><span class="sb-skeleton" style="width:92%"></span><span class="sb-skeleton" style="width:76%"></span><span class="sb-skeleton" style="width:58%"></span></div><p id="planLoadingText" class="clients-card-note" hidden></p></div>
        <div id="planNotice"></div>
        <div id="planBody"></div>

    </main>

    <script src="js/loadHeader.js"></script>

    <script type="module" src="js/icons.js"></script>
    <script type="module" src="js/myPlan.js"></script>
    <script>
        // If the page's code never loaded (no connection on first visit), don't sit on Loading.
        setTimeout(function () {
            var loading = document.getElementById("planLoading");
            if (!loading || loading.hidden || window.sbPlanStarted) return;
            loading.hidden = true;
            document.getElementById("planBody").innerHTML = '<div class="clients-card myplan-failed" role="alert"><div><strong>Couldn\'t load your plan</strong><p>Check your connection and try again. This doesn\'t mean your plan is empty.</p><button type="button" class="sb-btn sb-btn-secondary" onclick="location.reload()">Try again</button></div></div>';
        }, 20000);
    </script>

    <script src="js/registerSW.js"></script>

</body>

</html>
