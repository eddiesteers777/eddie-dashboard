<index.html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>75-Day Operating System</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#12151A;
  --surface:#1B1F26;
  --surface-alt:#222834;
  --line:#2C323D;
  --text:#ECEAE4;
  --muted:#8A8F98;
  --accent:#FF5C1F;
  --accent-dim:#7A3418;
  --teal:#2FB6B0;
  --amber:#FFB020;
  --font-display:'Bebas Neue', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:transparent;color:var(--text);font-family:var(--font-body);}
body{padding:28px 20px 60px;min-height:100vh;background:var(--bg);}
.wrap{max-width:980px;margin:0 auto;}

/* ---------- header ---------- */
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin:0 0 4px;}
.title-row{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
.day-count{font-family:var(--font-display);font-size:56px;line-height:1;letter-spacing:.03em;color:var(--text);}
.day-count span{color:var(--accent);}
.date-label{font-family:var(--font-mono);font-size:13px;color:var(--muted);text-align:right;}
.date-label b{color:var(--text);font-weight:600;}

/* ---------- course progress (signature element) ---------- */
.course{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 26px 16px;margin-bottom:22px;}
.course-track{position:relative;height:6px;background:var(--surface-alt);border-radius:3px;margin:26px 4px 10px;}
.course-fill{position:absolute;left:0;top:0;height:100%;background:var(--accent);border-radius:3px;transition:width .4s ease;}
.course-marker{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--accent);box-shadow:0 0 0 4px rgba(255,92,31,.15);}
.course-ticks{position:relative;height:0;}
.tick{position:absolute;top:-30px;transform:translateX(-50%);text-align:center;}
.tick .lbl{font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;}
.tick .dash{width:1px;height:8px;background:var(--line);margin:4px auto 0;}
.course-meta{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-top:14px;}
.course-meta b{color:var(--text);}

/* ---------- day nav ---------- */
.daynav{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.daynav button{background:var(--surface);border:1px solid var(--line);color:var(--text);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.daynav button:hover{border-color:var(--accent);color:var(--accent);}
.daynav .cur-date{font-family:var(--font-mono);font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--line);padding:8px 14px;border-radius:8px;flex:1;text-align:center;}
.daynav .today-btn{font-family:var(--font-body);font-size:12px;font-weight:600;background:var(--surface-alt);border:1px solid var(--line);color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer;}
.daynav .today-btn:hover{color:var(--text);border-color:var(--accent);}

/* ---------- grid layout ---------- */
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start;}
@media(max-width:760px){.grid{grid-template-columns:1fr;}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;}
.card h2{font-family:var(--font-display);font-size:20px;letter-spacing:.04em;margin:0 0 14px;color:var(--text);text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;}
.card h2 small{font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:0;text-transform:none;}

/* habit list */
.habit-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
.habit-row:last-child{border-bottom:none;}
.check{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:0 0 22px;cursor:pointer;position:relative;background:var(--surface-alt);transition:.15s;}
.check.on{background:var(--accent);border-color:var(--accent);}
.check.on::after{content:'';position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(40deg);}
.habit-name{flex:1;font-size:14.5px;font-weight:500;}
.habit-name.done{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line);}
.habit-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;opacity:.5;padding:2px 6px;}
.habit-del:hover{opacity:1;color:var(--accent);}

.manage-toggle{font-family:var(--font-mono);font-size:11px;color:var(--muted);background:none;border:none;cursor:pointer;letter-spacing:.05em;text-decoration:underline;text-underline-offset:3px;padding:0;}
.manage-toggle:hover{color:var(--text);}
.manage-box{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);display:none;}
.manage-box.open{display:block;}
.add-row{display:flex;gap:8px;margin-top:10px;}
.add-row input{flex:1;background:var(--surface-alt);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:8px;font-family:var(--font-body);font-size:13.5px;}
.add-row input:focus{outline:none;border-color:var(--accent);}
.add-row button{background:var(--accent);border:none;color:#141414;font-weight:700;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:13px;}
.add-row button:hover{opacity:.9;}
.manage-list{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
.manage-item{display:flex;justify-content:space-between;align-items:center;font-size:13px;background:var(--surface-alt);padding:7px 10px;border-radius:7px;}

/* stats */
.stat-big{font-family:var(--font-mono);font-size:38px;font-weight:700;color:var(--accent);line-height:1;}
.stat-sub{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.08em;font-family:var(--font-mono);}
.stat-row{display:flex;gap:20px;margin-bottom:18px;}
.stat-col{flex:1;}

.bar-row{margin-bottom:11px;}
.bar-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
.bar-top .pct{font-family:var(--font-mono);color:var(--muted);}
.bar-track{height:7px;background:var(--surface-alt);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;background:var(--teal);border-radius:4px;}
.bar-fill.low{background:var(--amber);}

.focus-item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);}
.focus-item:last-child{border-bottom:none;}
.focus-pct{font-family:var(--font-mono);font-size:13px;color:var(--amber);min-width:38px;}
.focus-name{font-size:13.5px;}
.empty-note{font-size:12.5px;color:var(--muted);font-style:italic;}

/* heatmap */
.heat-wrap{margin-top:22px;}
.heat-grid{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;}
@media(max-width:600px){.heat-grid{grid-template-columns:repeat(10,1fr);}}
.heat-cell{aspect-ratio:1;border-radius:4px;background:var(--surface-alt);cursor:pointer;position:relative;border:1px solid transparent;}
.heat-cell.future{opacity:.35;cursor:default;}
.heat-cell.selected{border-color:var(--text);}
.heat-legend{display:flex;align-items:center;gap:6px;margin-top:10px;font-family:var(--font-mono);font-size:10px;color:var(--muted);}
.heat-legend .sw{width:11px;height:11px;border-radius:3px;}

.quote{font-family:var(--font-body);font-style:italic;font-size:13px;color:var(--muted);margin-top:18px;padding-top:14px;border-top:1px solid var(--line);}

.reset-link{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);text-align:center;margin-top:26px;opacity:.6;}
.reset-link button{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-family:inherit;font-size:inherit;}
.reset-link button:hover{color:var(--accent);}

.loading{text-align:center;color:var(--muted);font-family:var(--font-mono);font-size:12px;padding:40px 0;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Loading your operating system…</div>
</div>

<script>
const START = '2026-07-24';
const END   = '2026-10-06';
const MILE_LABELS = [
  {pct:0,label:'START'},
  {pct:33,label:'25K'},
  {pct:66,label:'50K'},
  {pct:100,label:'FINISH'}
];
const QUOTES = [
  "Discipline is the training wheel that comes off once the habit can ride alone.",
  "You don't rise to the challenge, you fall to the level of your system.",
  "The mile you don't want to run is the one that builds the runner.",
  "Consistency is a boring word for an extraordinary result.",
  "Small checkmarks, stacked daily, outrun big intentions every time.",
  "Show up on the flat days. The hills take care of themselves.",
  "A streak is just yesterday's discipline, repeated.",
  "Nobody drowns in mile 20. They drown in mile 1 they never started.",
  "Progress hides in the days that feel unremarkable.",
  "The plan is only real on the day you check the box."
];

const DEFAULT_HABITS = [
  {id:'h1',name:'🙏 Prayer'},
  {id:'h2',name:'📖 Bible'},
  {id:'h3',name:'🏃 Training Complete'},
  {id:'h4',name:'💪 Strength'},
  {id:'h5',name:'🧘 Stretch / Mobility'},
  {id:'h6',name:'🥩 Protein Goal'},
  {id:'h7',name:'💧 Water Goal'},
  {id:'h8',name:'😴 Sleep 7+ hrs'},
  {id:'h9',name:'📚 Read 10 Pages'},
  {id:'h10',name:'❤️ Time with Wife'}
];

function toDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); }
function toStr(d){ return d.toISOString().slice(0,10); }
function addDays(s,n){ const d=toDate(s); d.setUTCDate(d.getUTCDate()+n); return toStr(d); }
function dayIndex(s){ // 1-based index within challenge
  const start=toDate(START), cur=toDate(s);
  return Math.round((cur-start)/86400000)+1;
}
function fmtNice(s){
  const d=toDate(s);
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'});
}
function allDays(){
  const out=[]; let s=START;
  while(true){ out.push(s); if(s===END) break; s=addDays(s,1); }
  return out;
}
const ALL_DAYS = allDays();
const TOTAL_DAYS = ALL_DAYS.length;

function todayStr(){
  const d=new Date();
  const s=toStr(new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())));
  if(s<START) return START;
  if(s>END) return END;
  return s;
}

let habits=[];
let entries={}; // {date: {habitId:true}}
let current=todayStr();
let manageOpen=false;

async function loadData(){
  try{
    const h = await window.storage.get('habits');
    habits = h ? JSON.parse(h.value) : DEFAULT_HABITS;
  }catch(e){ habits = DEFAULT_HABITS; }
  try{
    const e = await window.storage.get('entries');
    entries = e ? JSON.parse(e.value) : {};
  }catch(e){ entries = {}; }
}
async function saveHabits(){
  try{ await window.storage.set('habits', JSON.stringify(habits)); }catch(e){ console.error('save habits failed',e); }
}
async function saveEntries(){
  try{ await window.storage.set('entries', JSON.stringify(entries)); }catch(e){ console.error('save entries failed',e); }
}

function isChecked(date,hid){ return !!(entries[date] && entries[date][hid]); }
function toggleCheck(date,hid){
  if(!entries[date]) entries[date]={};
  entries[date][hid] = !entries[date][hid];
  if(!entries[date][hid]) delete entries[date][hid];
  saveEntries();
  render();
}
function dayComplete(date){
  if(habits.length===0) return false;
  return habits.every(h=>isChecked(date,h.id));
}
function dayPct(date){
  if(habits.length===0) return 0;
  const c = habits.filter(h=>isChecked(date,h.id)).length;
  return Math.round((c/habits.length)*100);
}

function elapsedDays(){
  const t=todayStr();
  const idx = Math.min(dayIndex(t), TOTAL_DAYS);
  return Math.max(idx,0);
}

function habitCompletionPct(hid){
  const ed = elapsedDays();
  if(ed===0) return null;
  let count=0;
  for(let i=0;i<ed;i++){ if(isChecked(ALL_DAYS[i],hid)) count++; }
  return Math.round((count/ed)*100);
}

function overallPct(){
  const ed = elapsedDays();
  if(ed===0 || habits.length===0) return null;
  let total=0, checked=0;
  for(let i=0;i<ed;i++){
    habits.forEach(h=>{ total++; if(isChecked(ALL_DAYS[i],h.id)) checked++; });
  }
  return total? Math.round((checked/total)*100) : null;
}

function currentStreak(){
  const t = todayStr();
  let idx = dayIndex(t)-1; // 0-based index of today within ALL_DAYS
  if(idx<0) return 0;
  if(idx>=TOTAL_DAYS) idx=TOTAL_DAYS-1;
  let streak=0;
  for(let i=idx;i>=0;i--){
    if(dayComplete(ALL_DAYS[i])) streak++; else break;
  }
  return streak;
}
function longestStreak(){
  let best=0, run=0;
  const ed = elapsedDays();
  for(let i=0;i<ed;i++){
    if(dayComplete(ALL_DAYS[i])){ run++; best=Math.max(best,run); } else run=0;
  }
  return best;
}
function perfectDays(){
  const ed=elapsedDays(); let n=0;
  for(let i=0;i<ed;i++){ if(dayComplete(ALL_DAYS[i])) n++; }
  return n;
}

function focusAreas(){
  const ed = elapsedDays();
  if(ed<3) return null;
  const scored = habits.map(h=>({name:h.name,pct:habitCompletionPct(h.id)}))
    .filter(x=>x.pct!==null)
    .sort((a,b)=>a.pct-b.pct);
  return scored.slice(0,3).filter(x=>x.pct<90);
}

function el(tag,cls,html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e; }

function render(){
  const app=document.getElementById('app');
  app.innerHTML='';

  const idx = dayIndex(current);
  const progressPct = Math.min(100, Math.max(0, ((idx-1)/(TOTAL_DAYS-1))*100));
  const t = todayStr();
  const isFutureSelected = current > t;

  // header
  const head = el('div');
  head.innerHTML = `
    <p class="eyebrow">75-Day Operating System &middot; Jul 24 &ndash; Oct 6</p>
    <div class="title-row">
      <div class="day-count">DAY <span>${String(idx).padStart(2,'0')}</span> / ${TOTAL_DAYS}</div>
      <div class="date-label">Today &middot; <b>${fmtNice(t)}</b></div>
    </div>
  `;
  app.appendChild(head);

  // course progress
  const course = el('div','course');
  const tickHtml = MILE_LABELS.map(m=>`<div class="tick" style="left:${m.pct}%"><div class="dash"></div><div class="lbl">${m.label}</div></div>`).join('');
  course.innerHTML = `
    <div class="course-ticks">${tickHtml}</div>
    <div class="course-track">
      <div class="course-fill" style="width:${progressPct}%"></div>
      <div class="course-marker" style="left:${progressPct}%"></div>
    </div>
    <div class="course-meta"><span>${TOTAL_DAYS - dayIndex(t)} days remaining</span><span><b>${Math.round(((dayIndex(t))/TOTAL_DAYS)*100)}%</b> of the course covered</span></div>
  `;
  app.appendChild(course);

  // day nav
  const nav = el('div','daynav');
  nav.innerHTML = `
    <button id="prevDay" ${current<=START?'disabled style="opacity:.3;cursor:default;"':''}>&larr;</button>
    <div class="cur-date">${fmtNice(current)} ${isFutureSelected?'(upcoming)':''}</div>
    <button id="nextDay" ${current>=END?'disabled style="opacity:.3;cursor:default;"':''}>&rarr;</button>
    <button class="today-btn" id="jumpToday">Today</button>
  `;
  app.appendChild(nav);

  // grid
  const grid = el('div','grid');

  // checklist card
  const checklist = el('div','card');
  const doneCount = habits.filter(h=>isChecked(current,h.id)).length;
  checklist.innerHTML = `<h2>Today's Checklist <small>${doneCount}/${habits.length} done</small></h2>`;
  const list = el('div');
  if(habits.length===0){
    list.appendChild(el('div','empty-note','No habits yet — add one below.'));
  }
  habits.forEach(h=>{
    const on = isChecked(current,h.id);
    const row = el('div','habit-row');
    row.innerHTML = `
      <div class="check ${on?'on':''}" data-hid="${h.id}"></div>
      <div class="habit-name ${on?'done':''}">${h.name}</div>
    `;
    list.appendChild(row);
  });
  checklist.appendChild(list);

  const manageToggle = el('button','manage-toggle', manageOpen? 'Hide habit manager' : 'Edit / add / remove habits');
  checklist.appendChild(manageToggle);

  const manageBox = el('div','manage-box'+(manageOpen?' open':''));
  const manageList = el('div','manage-list');
  habits.forEach(h=>{
    const item = el('div','manage-item');
    item.innerHTML = `<span>${h.name}</span><button class="habit-del" data-del="${h.id}">✕</button>`;
    manageList.appendChild(item);
  });
  manageBox.appendChild(manageList);
  const addRow = el('div','add-row');
  addRow.innerHTML = `<input id="newHabitInput" placeholder="New habit, e.g. 🧘 Meditate 10 min" maxlength="60"/><button id="addHabitBtn">Add</button>`;
  manageBox.appendChild(addRow);
  checklist.appendChild(manageBox);

  grid.appendChild(checklist);

  // stats card
  const statsCard = el('div','card');
  const op = overallPct();
  const streak = currentStreak();
  statsCard.innerHTML = `<h2>Consistency</h2>`;
  const statRow = el('div','stat-row');
  statRow.innerHTML = `
    <div class="stat-col">
      <div class="stat-big">${op===null?'—':op+'%'}</div>
      <div class="stat-sub">Overall completion</div>
    </div>
    <div class="stat-col">
      <div class="stat-big" style="color:var(--teal)">${streak}${streak>0?' 🔥':''}</div>
      <div class="stat-sub">Current streak (days)</div>
    </div>
  `;
  statsCard.appendChild(statRow);

  const statRow2 = el('div','stat-row');
  statRow2.innerHTML = `
    <div class="stat-col">
      <div class="stat-big" style="font-size:26px;color:var(--text)">${longestStreak()}</div>
      <div class="stat-sub">Longest streak</div>
    </div>
    <div class="stat-col">
      <div class="stat-big" style="font-size:26px;color:var(--text)">${perfectDays()}</div>
      <div class="stat-sub">Perfect days</div>
    </div>
  `;
  statsCard.appendChild(statRow2);

  // per-habit bars
  const barsWrap = el('div');
  habits.forEach(h=>{
    const pct = habitCompletionPct(h.id);
    const row = el('div','bar-row');
    row.innerHTML = `
      <div class="bar-top"><span>${h.name}</span><span class="pct">${pct===null?'—':pct+'%'}</span></div>
      <div class="bar-track"><div class="bar-fill ${pct!==null&&pct<70?'low':''}" style="width:${pct||0}%"></div></div>
    `;
    barsWrap.appendChild(row);
  });
  statsCard.appendChild(barsWrap);

  // focus areas
  const focusWrap = el('div');
  focusWrap.appendChild(el('h2',null,'Areas to Grow'));
  const fa = focusAreas();
  if(fa===null){
    focusWrap.appendChild(el('div','empty-note','Give it a few days — your focus areas will surface once there is data.'));
  } else if(fa.length===0){
    focusWrap.appendChild(el('div','empty-note','Strong across the board. Nothing under 90% right now.'));
  } else {
    fa.forEach(f=>{
      const item = el('div','focus-item');
      item.innerHTML = `<div class="focus-pct">${f.pct}%</div><div class="focus-name">${f.name}</div>`;
      focusWrap.appendChild(item);
    });
  }
  statsCard.appendChild(focusWrap);

  const quote = el('div','quote', '"'+QUOTES[idx % QUOTES.length]+'"');
  statsCard.appendChild(quote);

  grid.appendChild(statsCard);
  app.appendChild(grid);

  // heatmap
  const heatCard = el('div','card heat-wrap');
  heatCard.innerHTML = `<h2>75-Day Course Map <small>click any day to jump</small></h2>`;
  const hg = el('div','heat-grid');
  const t2 = todayStr();
  ALL_DAYS.forEach(d=>{
    const isFuture = d>t2;
    const pct = isFuture ? null : dayPct(d);
    const cell = el('div','heat-cell'+(isFuture?' future':'')+(d===current?' selected':''));
    if(!isFuture){
      let bg = 'var(--surface-alt)';
      if(pct>0 && pct<50) bg = 'rgba(255,176,32,0.35)';
      else if(pct>=50 && pct<100) bg = 'rgba(47,182,176,0.55)';
      else if(pct===100) bg = 'var(--accent)';
      cell.style.background = bg;
    }
    cell.title = `${fmtNice(d)}${isFuture?' (upcoming)':' — '+pct+'%'}`;
    cell.dataset.date = d;
    hg.appendChild(cell);
  });
  heatCard.appendChild(hg);
  heatCard.appendChild(el('div','heat-legend',`
    <span class="sw" style="background:var(--surface-alt)"></span> none
    <span class="sw" style="background:rgba(255,176,32,0.35)"></span> partial
    <span class="sw" style="background:rgba(47,182,176,0.55)"></span> most
    <span class="sw" style="background:var(--accent)"></span> perfect
    <span class="sw" style="background:var(--surface-alt);opacity:.35"></span> upcoming
  `));
  app.appendChild(heatCard);

  app.appendChild(el('div','reset-link','<button id="resetBtn">Reset all data</button>'));

  wireEvents();
}

function wireEvents(){
  document.querySelectorAll('.check').forEach(c=>{
    c.addEventListener('click',()=>toggleCheck(current,c.dataset.hid));
  });
  const prev=document.getElementById('prevDay');
  const next=document.getElementById('nextDay');
  if(prev) prev.addEventListener('click',()=>{ if(current>START){ current=addDays(current,-1); render(); }});
  if(next) next.addEventListener('click',()=>{ if(current<END){ current=addDays(current,1); render(); }});
  const jt=document.getElementById('jumpToday');
  if(jt) jt.addEventListener('click',()=>{ current=todayStr(); render(); });

  const mt=document.querySelector('.manage-toggle');
  if(mt) mt.addEventListener('click',()=>{ manageOpen=!manageOpen; render(); });

  document.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click',()=>{
      const hid=b.dataset.del;
      habits = habits.filter(h=>h.id!==hid);
      saveHabits();
      render();
    });
  });

  const addBtn=document.getElementById('addHabitBtn');
  if(addBtn){
    const doAdd=()=>{
      const input=document.getElementById('newHabitInput');
      const val=input.value.trim();
      if(!val) return;
      const id='h'+Date.now();
      habits.push({id,name:val});
      saveHabits();
      manageOpen=true;
      render();
    };
    addBtn.addEventListener('click',doAdd);
    document.getElementById('newHabitInput').addEventListener('keydown',e=>{ if(e.key==='Enter') doAdd(); });
  }

  document.querySelectorAll('.heat-cell').forEach(c=>{
    if(!c.classList.contains('future')){
      c.addEventListener('click',()=>{ current=c.dataset.date; render(); });
    }
  });

  const resetBtn=document.getElementById('resetBtn');
  if(resetBtn) resetBtn.addEventListener('click', async ()=>{
    if(confirm('Reset all habits and checked days? This cannot be undone.')){
      habits=DEFAULT_HABITS;
      entries={};
      await saveHabits();
      await saveEntries();
      current=todayStr();
      render();
    }
  });
}

(async function init(){
  await loadData();
  render();
})();
</script>
</body>
</html>
