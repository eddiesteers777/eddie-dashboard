<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Get started | Southbound Coaching</title>
    <link rel="canonical" href="https://southboundcoaching.com/start.html">
    <noscript><meta http-equiv="refresh" content="0;url=start.html"></noscript>
    <script>
        // Old Apply links land on Get started. ?service=running|strength|soccer_* becomes ?sport=.
        (function () {
            var s = (new URLSearchParams(location.search).get("service") || "").toLowerCase();
            var sport = s.indexOf("soccer") === 0 ? "soccer" : (s === "running" || s === "strength") ? s : "";
            location.replace("start.html" + (sport ? "?sport=" + sport : ""));
        })();
    </script>
</head>
<body><p>This page moved to <a href="start.html">Get started</a>.</p></body>
</html>
