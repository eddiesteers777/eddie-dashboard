<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>75-Day Operating System</title>

<link rel="stylesheet" href="css/style.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#0F172A;
  --surface:#1E293B;
  --surface-alt:#273449;
  --line:#334155;
  --text:#F8FAFC;
  --muted:#94A3B8;
  --accent:#4EA8FF;
  --accent-dim:#2563EB;
  --teal:#2FB6B0;
  --amber:#FFB020;
  --font-display:'Bebas Neue',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}

*{box-sizing:border-box;}

html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
}

body{
    min-height:100vh;
}

.wrap{
    max-width:1400px;
    margin:36px auto 60px;
    padding:0 24px;
}

/* ---------- header ---------- */

.eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.2em;
    color:var(--muted);
    text-transform:uppercase;
    margin:0 0 6px;
}

.title-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:18px;
    flex-wrap:wrap;
    margin-bottom:24px;
}
.day-count{
    font-family:var(--font-display);
    font-size:64px;
    line-height:1;
    letter-spacing:.04em;
    color:var(--text);
}

.day-count span{
    color:var(--accent);
}

.date-label{
    font-family:var(--font-mono);
    font-size:13px;
    color:var(--muted);
    text-align:right;
}

.date-label b{
    color:var(--text);
    font-weight:700;
}

/* ---------- course progress ---------- */

.course{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:26px 30px 20px;
    margin-bottom:24px;
    box-shadow:0 8px 24px rgba(0,0,0,.18);
}

.course-track{
    position:relative;
    height:8px;
    background:var(--surface-alt);
    border-radius:999px;
    margin:28px 4px 12px;
}

.course-fill{
    position:absolute;
    inset:0 auto 0 0;
    background:var(--accent);
    border-radius:999px;
    transition:width .35s ease;
}

.course-marker{
    position:absolute;
    top:50%;
    transform:translate(-50%,-50%);
    width:16px;
    height:16px;
    border-radius:50%;
    background:var(--bg);
    border:4px solid var(--accent);
    box-shadow:0 0 0 5px rgba(78,168,255,.15);
}

.course-ticks{
    position:relative;
    height:0;
}
  .tick{
    position:absolute;
    top:-32px;
    transform:translateX(-50%);
    text-align:center;
}

.tick .lbl{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--muted);
    letter-spacing:.08em;
    text-transform:uppercase;
    white-space:nowrap;
}

.tick .dash{
    width:1px;
    height:10px;
    background:var(--line);
    margin:4px auto 0;
}

.course-meta{
    display:flex;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--muted);
    margin-top:16px;
}

.course-meta b{
    color:var(--text);
}

/* ---------- day navigation ---------- */

.daynav{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
}

.daynav button{
    width:38px;
    height:38px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--text);
    cursor:pointer;
    transition:.2s;
}

.daynav button:hover{
    border-color:var(--accent);
    color:var(--accent);
    transform:translateY(-1px);
}
.daynav .cur-date{
    flex:1;
    text-align:center;
    padding:10px 16px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:13px;
}

.daynav .today-btn{
    width:auto;
    padding:0 14px;
    font-family:var(--font-body);
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    background:var(--surface-alt);
}

.daynav .today-btn:hover{
    color:var(--text);
}

/* ---------- layout ---------- */

.grid{
    display:grid;
    grid-template-columns:1.45fr 1fr;
    gap:22px;
    align-items:start;
}

@media(max-width:900px){
    .grid{
        grid-template-columns:1fr;
    }
}

.card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:24px;
    box-shadow:0 8px 24px rgba(0,0,0,.16);
}

.card h2{
    margin:0 0 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:var(--font-display);
    font-size:22px;
    letter-spacing:.05em;
    text-transform:uppercase;
}

.card h2 small{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--muted);
    text-transform:none;
}
/* ---------- habit list ---------- */

.habit-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
}

.habit-row:last-child{
    border-bottom:none;
}

.check{
    width:24px;
    height:24px;
    flex:0 0 24px;
    border-radius:7px;
    border:2px solid var(--line);
    background:var(--surface-alt);
    cursor:pointer;
    position:relative;
    transition:.2s;
}

.check:hover{
    border-color:var(--accent);
}

.check.on{
    background:var(--accent);
    border-color:var(--accent);
}

.check.on::after{
    content:"";
    position:absolute;
    left:6px;
    top:2px;
    width:6px;
    height:11px;
    border:solid #0F172A;
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
}

.habit-name{
    flex:1;
    font-size:15px;
    font-weight:500;
}

.habit-name.done{
    color:var(--muted);
    text-decoration:line-through;
}

.habit-del{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:17px;
    opacity:.55;
}

.habit-del:hover{
    color:var(--accent);
    opacity:1;
}
.manage-toggle{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.06em;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    padding:0;
    text-decoration:underline;
    text-underline-offset:3px;
}

.manage-toggle:hover{
    color:var(--accent);
}

.manage-box{
    display:none;
    margin-top:16px;
    padding-top:16px;
    border-top:1px dashed var(--line);
}

.manage-box.open{
    display:block;
}

.add-row{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.add-row input{
    flex:1;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--surface-alt);
    color:var(--text);
    font-size:14px;
    font-family:var(--font-body);
}

.add-row input:focus{
    outline:none;
    border-color:var(--accent);
}

.add-row button{
    padding:10px 18px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#0F172A;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.add-row button:hover{
    opacity:.9;
}

.manage-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:14px;
}

.manage-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 12px;
    border-radius:10px;
    background:var(--surface-alt);
    font-size:13px;
}
/* ---------- stats ---------- */

.stat-row{
    display:flex;
    gap:22px;
    margin-bottom:20px;
}

.stat-col{
    flex:1;
}

.stat-big{
    font-family:var(--font-mono);
    font-size:40px;
    font-weight:700;
    line-height:1;
    color:var(--accent);
}

.stat-sub{
    margin-top:5px;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
}

.bar-row{
    margin-bottom:12px;
}

.bar-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
    font-size:13px;
}

.bar-top .pct{
    font-family:var(--font-mono);
    color:var(--muted);
}

.bar-track{
    height:8px;
    border-radius:999px;
    background:var(--surface-alt);
    overflow:hidden;
}

.bar-fill{
    height:100%;
    border-radius:999px;
    background:var(--teal);
    transition:width .25s ease;
}

.bar-fill.low{
    background:var(--amber);
}
.focus-item{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
}

.focus-item:last-child{
    border-bottom:none;
}

.focus-pct{
    min-width:42px;
    font-family:var(--font-mono);
    font-size:13px;
    font-weight:700;
    color:var(--amber);
}

.focus-name{
    flex:1;
    font-size:14px;
    line-height:1.4;
}

.empty-note{
    font-size:13px;
    color:var(--muted);
    font-style:italic;
}

/* ---------- heat map ---------- */

.heat-wrap{
    margin-top:24px;
}

.heat-grid{
    display:grid;
    grid-template-columns:repeat(15,1fr);
    gap:5px;
}

@media(max-width:700px){
    .heat-grid{
        grid-template-columns:repeat(10,1fr);
    }
}

.heat-cell{
    aspect-ratio:1;
    border-radius:5px;
    background:var(--surface-alt);
    border:1px solid transparent;
    cursor:pointer;
    transition:.15s;
}

.heat-cell:hover{
    transform:scale(1.08);
}

.heat-cell.selected{
    border-color:var(--text);
}

.heat-cell.future{
    opacity:.35;
    cursor:default;
}
.heat-legend{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:12px;
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--muted);
    flex-wrap:wrap;
}

.heat-legend .sw{
    width:12px;
    height:12px;
    border-radius:3px;
}

.quote{
    margin-top:20px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-size:13px;
    font-style:italic;
    line-height:1.6;
    color:var(--muted);
}

.reset-link{
    margin-top:28px;
    text-align:center;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--muted);
}

.reset-link button{
    background:none;
    border:none;
    color:inherit;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
    font:inherit;
}

.reset-link button:hover{
    color:var(--accent);
}

.loading{
    padding:50px 0;
    text-align:center;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--muted);
}
</style>
</head>

<body>

<div id="header"></div>

<div class="wrap" id="app">
    <div class="loading">Loading your operating system...</div>
</div>

<script src="js/loadHeader.js"></script>

<script>
const START = '2026-07-24';
const END   = '2026-10-06';

const MILE_LABELS = [
  {pct:0,label:'START'},
  {pct:33,label:'25%'},
  {pct:66,label:'50%'},
  {pct:100,label:'FINISH'}
];

const QUOTES = [
  "Discipline is the training wheel that comes off once the habit can ride alone.",
  "You don't rise to the challenge, you fall to the level of your system.",
  "The mile you don't want to run is the one that builds the runner.",
  "Consistency is a boring word for an extraordinary result.",
  "Small checkmarks, stacked daily, outrun big intentions every time.",
  "Show up on the flat days. The hills take care of themselves.",
  "A streak is just yesterday's discipline, repeated.",
  "Nobody drowns in mile 20. They drown in mile 1 they never started.",
  "Progress hides in the days that feel unremarkable.",
  "The plan is only real on the day you check the box."
];

const DEFAULT_HABITS = [
  {id:'h1',name:'🙏 Prayer'},
  {id:'h2',name:'📖 Bible'},
  {id:'h3',name:'🏃 Training Complete'},
  {id:'h4',name:'💪 Strength'},
  {id:'h5',name:'🧘 Stretch / Mobility'},
  {id:'h6',name:'🥩 Protein Goal'},
  {id:'h7',name:'💧 Water Goal'},
  {id:'h8',name:'😴 Sleep 7+ hrs'},
  {id:'h9',name:'📚 Read 10 Pages'},
  {id:'h10',name:'❤️ Time with Wife'}
];

function toDate(s){
  const [y,m,d]=s.split('-').map(Number);
  return new Date(Date.UTC(y,m-1,d));
}

function toStr(d){
  return d.toISOString().slice(0,10);
}

function addDays(s,n){
  const d=toDate(s);
  d.setUTCDate(d.getUTCDate()+n);
  return toStr(d);
}

function dayIndex(s){
  const start=toDate(START);
  const cur=toDate(s);
  return Math.round((cur-start)/86400000)+1;
}

function fmtNice(s){
  const d=toDate(s);
  return d.toLocaleDateString('en-US',{
    weekday:'short',
    month:'short',
    day:'numeric',
    timeZone:'UTC'
  });
}

function allDays(){
  const out=[];
  let s=START;

  while(true){
    out.push(s);
    if(s===END) break;
    s=addDays(s,1);
  }

  return out;
}

const ALL_DAYS=allDays();
const TOTAL_DAYS=ALL_DAYS.length;

function todayStr(){
  const d=new Date();

  const s=toStr(
    new Date(Date.UTC(
      d.getFullYear(),
      d.getMonth(),
      d.getDate()
    ))
  );

  if(s<START) return START;
  if(s>END) return END;

  return s;
}

let habits=[];
let entries={};
let current=todayStr();
let manageOpen=false;

function loadData(){

  try{
    const h=localStorage.getItem('habits');
    habits=h ? JSON.parse(h) : [...DEFAULT_HABITS];
  }catch{
    habits=[...DEFAULT_HABITS];
  }

  try{
    const e=localStorage.getItem('entries');
    entries=e ? JSON.parse(e) : {};
  }catch{
    entries={};
  }

}
function saveHabits(){
  localStorage.setItem(
    'habits',
    JSON.stringify(habits)
  );
}

function saveEntries(){
  localStorage.setItem(
    'entries',
    JSON.stringify(entries)
  );
}

function saveAll(){
  saveHabits();
  saveEntries();
}

function exportData(){

  const blob=new Blob(
    [JSON.stringify({habits,entries},null,2)],
    {type:'application/json'}
  );

  const a=document.createElement('a');

  a.href=URL.createObjectURL(blob);
  a.download='75-day-operating-system-backup.json';
  a.click();

  URL.revokeObjectURL(a.href);
}

function importData(file){

  const reader=new FileReader();

  reader.onload=e=>{

    try{

      const data=JSON.parse(e.target.result);

      habits=data.habits || [...DEFAULT_HABITS];
      entries=data.entries || {};

      saveAll();
      render();

      alert('Data imported!');

    }catch{

      alert('Invalid backup file.');

    }

  };

  reader.readAsText(file);

}

function isChecked(date,habitId){
  return !!(entries[date] && entries[date][habitId]);
}

function toggleCheck(date,habitId){
  if(!entries[date]){
    entries[date]={};
  }

  entries[date][habitId]=!entries[date][habitId];

  if(!entries[date][habitId]){
    delete entries[date][habitId];
  }

  saveEntries();
  render();
}

function dayComplete(date){

  if(habits.length===0){
    return false;
  }

  return habits.every(h=>isChecked(date,h.id));

}

function dayPct(date){

  if(habits.length===0){
    return 0;
  }

  const complete=habits.filter(h=>isChecked(date,h.id)).length;

  return Math.round((complete/habits.length)*100);

}

function elapsedDays(){

  const today=todayStr();

  const index=Math.min(
    dayIndex(today),
    TOTAL_DAYS
  );

  return Math.max(index,0);

}

function habitCompletionPct(habitId){

  const elapsed=elapsedDays();

  if(elapsed===0){
    return null;
  }

  let completed=0;

  for(let i=0;i<elapsed;i++){

    if(isChecked(ALL_DAYS[i],habitId)){
      completed++;
    }

  }

  return Math.round((completed/elapsed)*100);

}

function overallPct(){
  const elapsed=elapsedDays();

  if(elapsed===0 || habits.length===0){
    return null;
  }

  let total=0;
  let completed=0;

  for(let i=0;i<elapsed;i++){

    habits.forEach(h=>{

      total++;

      if(isChecked(ALL_DAYS[i],h.id)){
        completed++;
      }

    });

  }

  return total
    ? Math.round((completed/total)*100)
    : null;

}

function currentStreak(){

  const today=todayStr();

  let index=dayIndex(today)-1;

  if(index<0){
    return 0;
  }

  if(index>=TOTAL_DAYS){
    index=TOTAL_DAYS-1;
  }

  let streak=0;

  for(let i=index;i>=0;i--){

    if(dayComplete(ALL_DAYS[i])){
      streak++;
    }else{
      break;
    }

  }

  return streak;

}

function longestStreak(){

  let best=0;
  let run=0;

  const elapsed=elapsedDays();
    for(let i=0;i<elapsed;i++){

    if(dayComplete(ALL_DAYS[i])){
      run++;
      best=Math.max(best,run);
    }else{
      run=0;
    }

  }

  return best;

}

function perfectDays(){

  const elapsed=elapsedDays();

  let total=0;

  for(let i=0;i<elapsed;i++){

    if(dayComplete(ALL_DAYS[i])){
      total++;
    }

  }

  return total;

}

function focusAreas(){

  const elapsed=elapsedDays();

  if(elapsed<3){
    return null;
  }

  const ranked=habits
    .map(h=>({
      name:h.name,
      pct:habitCompletionPct(h.id)
    }))
    .filter(h=>h.pct!==null)
    .sort((a,b)=>a.pct-b.pct);

  return ranked
    .slice(0,3)
    .filter(h=>h.pct<90);

}

function el(tag,className,html){

  const element=document.createElement(tag);

  if(className){
    element.className=className;
  }

  if(html!==undefined){
    element.innerHTML=html;
  }

  return element;

}

function render(){

  const app=document.getElementById('app');

  app.innerHTML='';

  const day=dayIndex(current);
    const progressPct=Math.min(
    100,
    Math.max(
      0,
      ((day-1)/(TOTAL_DAYS-1))*100
    )
  );

  const today=todayStr();
  const future=current>today;

  const header=el('div');

  header.innerHTML=`
    <p class="eyebrow">
      75-Day Operating System &middot; Jul 24 &ndash; Oct 6
    </p>

    <div class="title-row">
      <div class="day-count">
        DAY <span>${String(day).padStart(2,'0')}</span> / ${TOTAL_DAYS}
      </div>

      <div class="date-label">
        Today &middot;
        <b>${fmtNice(today)}</b>
      </div>
    </div>
  `;

  app.appendChild(header);

  const course=el('div','course');

  const ticks=MILE_LABELS
    .map(m=>`
      <div class="tick" style="left:${m.pct}%">
        <div class="dash"></div>
        <div class="lbl">${m.label}</div>
      </div>
    `)
    .join('');

  course.innerHTML=`
    <div class="course-ticks">
      ${ticks}
    </div>

    <div class="course-track">
      <div class="course-fill"
           style="width:${progressPct}%"></div>

      <div class="course-marker"
           style="left:${progressPct}%"></div>
    </div>
    <div class="course-meta">
      <span>
        ${TOTAL_DAYS-dayIndex(today)} days remaining
      </span>

      <span>
        <b>${Math.round((dayIndex(today)/TOTAL_DAYS)*100)}%</b>
        of the course completed
      </span>
    </div>
  `;

  app.appendChild(course);

  const nav=el('div','daynav');

  nav.innerHTML=`
    <button id="prevDay"
      ${current<=START?'disabled style="opacity:.35;cursor:default;"':''}>
      &larr;
    </button>

    <div class="cur-date">
      ${fmtNice(current)}
      ${future?'(Upcoming)':''}
    </div>

    <button id="nextDay"
      ${current>=END?'disabled style="opacity:.35;cursor:default;"':''}>
      &rarr;
    </button>

    <button class="today-btn" id="jumpToday">
      Today
    </button>
  `;

  app.appendChild(nav);

  const grid=el('div','grid');

  const checklist=el('div','card');

  const doneCount=habits.filter(h=>isChecked(current,h.id)).length;

  checklist.innerHTML=`
    <h2>
      Today's Checklist
      <small>${doneCount}/${habits.length} done</small>
    </h2>
  `;

  const list=el('div');

  if(habits.length===0){
    list.appendChild(
      el('div','empty-note','No habits yet — add one below.')
    );
  }
    habits.forEach(h=>{

    const checked=isChecked(current,h.id);

    const row=el('div','habit-row');

    row.innerHTML=`
      <div class="check ${checked?'on':''}"
           data-hid="${h.id}"></div>

      <div class="habit-name ${checked?'done':''}">
        ${h.name}
      </div>
    `;

    list.appendChild(row);

  });

  checklist.appendChild(list);

  const manageToggle=el(
    'button',
    'manage-toggle',
    manageOpen
      ? 'Hide habit manager'
      : 'Edit / add / remove habits'
  );

  checklist.appendChild(manageToggle);

  const manageBox=el(
    'div',
    'manage-box'+(manageOpen?' open':'')
  );

  const manageList=el('div','manage-list');

  habits.forEach(h=>{

    const item=el('div','manage-item');

    item.innerHTML=`
      <span>${h.name}</span>

      <button
        class="habit-del"
        data-del="${h.id}">
        ✕
      </button>
    `;

    manageList.appendChild(item);

  });

  manageBox.appendChild(manageList);

  const addRow=el('div','add-row');

  addRow.innerHTML=`
    <input
      id="newHabitInput"
      maxlength="60"
      placeholder="New habit..." />

    <button id="addHabitBtn">
      Add
    </button>
  `;

  manageBox.appendChild(addRow);

  checklist.appendChild(manageBox);

  grid.appendChild(checklist);
    const statsCard=el('div','card');

  const overall=overallPct();
  const streak=currentStreak();

  statsCard.innerHTML=`<h2>Consistency</h2>`;

  const statRow=el('div','stat-row');

  statRow.innerHTML=`
    <div class="stat-col">
      <div class="stat-big">
        ${overall===null?'—':overall+'%'}
      </div>

      <div class="stat-sub">
        Overall completion
      </div>
    </div>

    <div class="stat-col">
      <div class="stat-big" style="color:var(--teal)">
        ${streak}${streak>0?' 🔥':''}
      </div>

      <div class="stat-sub">
        Current streak
      </div>
    </div>
  `;

  statsCard.appendChild(statRow);

  const statRow2=el('div','stat-row');

  statRow2.innerHTML=`
    <div class="stat-col">
      <div class="stat-big"
           style="font-size:28px;color:var(--text)">
        ${longestStreak()}
      </div>

      <div class="stat-sub">
        Longest streak
      </div>
    </div>

    <div class="stat-col">
      <div class="stat-big"
           style="font-size:28px;color:var(--text)">
        ${perfectDays()}
      </div>

      <div class="stat-sub">
        Perfect days
      </div>
    </div>
  `;

  statsCard.appendChild(statRow2);

  const barsWrap=el('div');

  habits.forEach(h=>{

    const pct=habitCompletionPct(h.id);

    const row=el('div','bar-row');

    row.innerHTML=`
      <div class="bar-top">
        <span>${h.name}</span>

        <span class="pct">
          ${pct===null?'—':pct+'%'}
        </span>
      </div>

      <div class="bar-track">
        <div class="bar-fill ${pct!==null&&pct<70?'low':''}"
             style="width:${pct||0}%">
        </div>
      </div>
    `;

    barsWrap.appendChild(row);

  });

  statsCard.appendChild(barsWrap);
    const focusWrap=el('div');

  focusWrap.appendChild(
    el('h2',null,'Areas to Grow')
  );

  const focus=focusAreas();

  if(focus===null){

    focusWrap.appendChild(
      el(
        'div',
        'empty-note',
        'Give it a few days—your focus areas will appear once there is enough data.'
      )
    );

  }else if(focus.length===0){

    focusWrap.appendChild(
      el(
        'div',
        'empty-note',
        'Strong across the board. Nothing under 90% right now.'
      )
    );

  }else{

    focus.forEach(item=>{

      const row=el('div','focus-item');

      row.innerHTML=`
        <div class="focus-pct">
          ${item.pct}%
        </div>

        <div class="focus-name">
          ${item.name}
        </div>
      `;

      focusWrap.appendChild(row);

    });

  }

  statsCard.appendChild(focusWrap);

  statsCard.appendChild(
    el(
      'div',
      'quote',
      `"${QUOTES[day % QUOTES.length]}"`
    )
  );

  grid.appendChild(statsCard);

  app.appendChild(grid);

  const heatCard=el('div','card heat-wrap');

  heatCard.innerHTML=`
    <h2>
      75-Day Course Map
      <small>Click any day to jump</small>
    </h2>
  `;

  const heatGrid=el('div','heat-grid');

  const today2=todayStr();
    ALL_DAYS.forEach(date=>{

    const future=date>today2;
    const pct=future ? null : dayPct(date);

    const cell=el(
      'div',
      'heat-cell'+
      (future?' future':'')+
      (date===current?' selected':'')
    );

    if(!future){

      let color='var(--surface-alt)';

      if(pct>0 && pct<50){
        color='rgba(255,176,32,.35)';
      }else if(pct>=50 && pct<100){
        color='rgba(47,182,176,.55)';
      }else if(pct===100){
        color='var(--accent)';
      }

      cell.style.background=color;

    }

    cell.title=`${fmtNice(date)}${
      future
        ? ' (Upcoming)'
        : ' — '+pct+'%'
    }`;

    cell.dataset.date=date;

    heatGrid.appendChild(cell);

  });

  heatCard.appendChild(heatGrid);

  heatCard.appendChild(
    el(
      'div',
      'heat-legend',
      `
      <span class="sw" style="background:var(--surface-alt)"></span> none
      <span class="sw" style="background:rgba(255,176,32,.35)"></span> partial
      <span class="sw" style="background:rgba(47,182,176,.55)"></span> most
      <span class="sw" style="background:var(--accent)"></span> perfect
      <span class="sw" style="background:var(--surface-alt);opacity:.35"></span> upcoming
      `
    )
  );

  app.appendChild(heatCard);

  app.appendChild(
    el(
      'div',
      'reset-link',
      '<button id="saveBtn">💾 Save Now</button>&nbsp;'+
      '<button id="exportBtn">📤 Export</button>&nbsp;'+
      '<label style="cursor:pointer;text-decoration:underline;">📥 Import<input id="importFile" type="file" accept=".json" style="display:none"></label>&nbsp;'+
      '<button id="resetBtn">Reset all data</button>'
    )
  );

  wireEvents();

}
function wireEvents(){

  document.querySelectorAll('.check').forEach(box=>{

    box.addEventListener('click',()=>{

      toggleCheck(current,box.dataset.hid);

    });

  });

  const prev=document.getElementById('prevDay');
  const next=document.getElementById('nextDay');

  if(prev){

    prev.addEventListener('click',()=>{

      if(current>START){

        current=addDays(current,-1);

        render();

      }

    });

  }

  if(next){

    next.addEventListener('click',()=>{

      if(current<END){

        current=addDays(current,1);

        render();

      }

    });

  }

  const todayBtn=document.getElementById('jumpToday');

  if(todayBtn){

    todayBtn.addEventListener('click',()=>{

      current=todayStr();

      render();

    });

  }

  const manageBtn=document.querySelector('.manage-toggle');

  if(manageBtn){

    manageBtn.addEventListener('click',()=>{

      manageOpen=!manageOpen;

      render();

    });

  }

  document.querySelectorAll('[data-del]').forEach(btn=>{

    btn.addEventListener('click',()=>{

      habits=habits.filter(h=>h.id!==btn.dataset.del);

      saveHabits();

      render();

    });

  });

  const addBtn=document.getElementById('addHabitBtn');

  if(addBtn){

    const addHabit=()=>{

      const input=document.getElementById('newHabitInput');

      const value=input.value.trim();

      if(!value) return;

      habits.push({
        id:'h'+Date.now(),
        name:value
      });

      saveHabits();

      manageOpen=true;

      render();

    };

    addBtn.addEventListener('click',addHabit);

    document
      .getElementById('newHabitInput')
      .addEventListener('keydown',e=>{

        if(e.key==='Enter'){

          addHabit();

        }

      });

  }
    document.querySelectorAll('.heat-cell').forEach(cell=>{

    if(!cell.classList.contains('future')){

      cell.addEventListener('click',()=>{

        current=cell.dataset.date;

        render();

      });

    }

  });

  const saveBtn=document.getElementById('saveBtn');

  if(saveBtn){

    saveBtn.addEventListener('click',()=>{

      saveAll();

      alert('Saved!');

    });

  }

  const exportBtn=document.getElementById('exportBtn');

  if(exportBtn){

    exportBtn.addEventListener('click',exportData);

  }

  const importFile=document.getElementById('importFile');

  if(importFile){

    importFile.addEventListener('change',e=>{

      if(e.target.files.length){

        importData(e.target.files[0]);

      }

    });

  }

  const resetBtn=document.getElementById('resetBtn');

  if(resetBtn){

    resetBtn.addEventListener('click',()=>{

      if(confirm('Reset all habits and checked days? This cannot be undone.')){

        habits=[...DEFAULT_HABITS];

        entries={};

        saveHabits();

        saveEntries();

        current=todayStr();

        render();

      }

    });

  }

}

(function init(){

  loadData();

  render();

})();
</script>

</body>
</html>
